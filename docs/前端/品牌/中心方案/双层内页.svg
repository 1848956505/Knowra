<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="rearBlue" x1="69" y1="69" x2="229" y2="229" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2678FF"/>
      <stop offset=".52" stop-color="#1368F8"/>
      <stop offset="1" stop-color="#0755E8"/>
    </linearGradient>
    <radialGradient id="rearLight" cx="99" cy="99" r="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frontBlue" x1="26" y1="26" x2="186" y2="186" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1966F7"/>
      <stop offset=".48" stop-color="#0B5CF0"/>
      <stop offset="1" stop-color="#084BDD"/>
    </linearGradient>
    <linearGradient id="innerWhite" x1="37" y1="37" x2="175" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#FAFCFF"/>
      <stop offset="1" stop-color="#F0F6FF"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#164AB8" flood-opacity=".14"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#1A56B8" flood-opacity=".18"/>
    </filter>
    <linearGradient id="innerBack" x1="94" y1="94" x2="141" y2="141" gradientUnits="userSpaceOnUse"><stop stop-color="#97D0FF"/><stop offset="1" stop-color="#3487F4"/></linearGradient>
    <linearGradient id="innerFront" x1="71" y1="71" x2="123" y2="123" gradientUnits="userSpaceOnUse"><stop stop-color="#4997FF"/><stop offset="1" stop-color="#0C58DE"/></linearGradient>
  </defs>
  <g filter="url(#softShadow)">
    <rect x="69" y="69" width="160" height="160" rx="7" fill="url(#rearBlue)"/>
    <rect x="69" y="69" width="160" height="160" rx="7" fill="url(#rearLight)"/>
  </g>
  <g filter="url(#softShadow)">
    <rect x="26" y="26" width="160" height="160" rx="7" fill="url(#frontBlue)"/>
    <rect x="37" y="37" width="138" height="138" rx="1.5" fill="url(#innerWhite)"/>
  </g>
  <g filter="url(#nodeShadow)"><rect x="94" y="94" width="47" height="47" rx="7" fill="url(#innerBack)"/></g>
  <g filter="url(#nodeShadow)"><rect x="71" y="71" width="52" height="52" rx="8" fill="url(#innerFront)" fill-opacity=".96"/></g>
</svg>
