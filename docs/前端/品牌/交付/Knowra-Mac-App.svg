  <g filter="url(#macTileShadow)">
    <rect x="18" y="18" width="220" height="220" rx="53" fill="url(#macTile)"/>
    <g clip-path="url(#macTileClip)"><rect x="18" y="18" width="220" height="220" fill="url(#macTileGlow)"/></g>
    <rect x="18.7" y="18.7" width="218.6" height="218.6" rx="52.3" stroke="url(#macTileEdge)" stroke-width="1.4"/>
    <path d="M72 26C93 22 164 22 185 26" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(11 11) scale(.91)"><g filter="url(#softShadow)">
