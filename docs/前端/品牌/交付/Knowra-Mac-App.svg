    </linearGradient>
    <radialGradient id="macTileGlow" cx="128" cy="225" r="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#94C4FF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="macTileEdge" x1="128" y1="18" x2="128" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
