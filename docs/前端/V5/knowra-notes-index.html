<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知境 笔记索引原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 笔记索引页原型。外壳、色板、材质全部沿用 knowra-layered.html，只新增索引页自己的部分（.ph .pt .fchips .lw .row .card .menu .bulk 等）。
   功能参照 apps/web-v4/src/features/notes：范围入口、文件夹树、标签筛选、类型/排序/视图、分页、批量管理、拖拽移动、回收站。
   版式参照 Linear：紧凑单行列表 + 分组表头 + 悬浮出现的复选框 + 可组合的筛选条 + 底部浮动批量条。 */
:root{
  --chrome:#e1e4ea;
  --page:#fbfcfd;
  --ink:#17181b; --ink-2:#686d76; --ink-3:#8a8f99; --ink-4:#b4b9c6;
  --line:rgba(24,30,48,.075); --line-2:rgba(24,30,48,.12);
  --hover:rgba(24,30,48,.045); --press:rgba(24,30,48,.085);
  --accent:#f26b1d; --accent-ink:#c4510c;
  --accent-soft:color-mix(in srgb,var(--accent) 9%,#fff);
  --accent-line:color-mix(in srgb,var(--accent) 24%,#fff);
  --st-active:#d9962b; --st-done:#2fa866;
  --danger:#c23a3a; --danger-soft:#fbeeee;
  --sh-page:0 0 0 1px rgba(24,30,48,.07),0 1px 2px rgba(24,30,48,.05),0 6px 18px -6px rgba(24,30,48,.10),0 22px 48px -18px rgba(24,30,48,.14);
  --sh-pop:0 0 0 1px rgba(24,30,48,.08),0 4px 10px rgba(24,30,48,.06),0 24px 64px -12px rgba(24,30,48,.28);
  --sh-card:0 0 0 1px rgba(24,30,48,.07),0 1px 2px rgba(24,30,48,.04);
  --ui:"Inter","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--ink);font:400 13px/1.5 var(--ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"calt","kern"}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;transition:background .12s var(--ease),color .12s var(--ease),box-shadow .12s var(--ease)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-columns:56px auto minmax(0,1fr);grid-template-rows:46px minmax(0,1fr);
  background:radial-gradient(460px 320px at 6% 4%,rgba(255,255,255,.32),transparent 70%),radial-gradient(640px 560px at -4% 104%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 66%),var(--chrome)}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:rgba(24,30,48,.06)}
.seg button{height:22px;padding:0 8px;border-radius:6px;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(24,30,48,.08)}
.seg.icons button{width:26px;padding:0;justify-content:center}
.seg.icons .i{width:14px;height:14px}

/* ===== 顶栏 / 图标栏（与分层外壳一致）===== */
.top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;min-width:0}
.ib{width:28px;height:28px;border-radius:7px;display:inline-grid;place-items:center;color:var(--ink-3);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib:disabled{opacity:.4;cursor:default;background:none}
.ib[aria-pressed=true]{background:var(--press);color:var(--ink)}
.tabs{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none;padding:8px 4px;margin:-8px -4px -8px 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;height:30px;max-width:190px;padding:0 6px 0 10px;border-radius:8px;color:var(--ink-2);font-size:12.5px;font-weight:450;flex:none;position:relative;cursor:pointer}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab>.i{width:14px;height:14px;color:var(--ink-3)}
.tab:hover{background:var(--hover)}
.tab[aria-selected=true]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 0 0 1px rgba(24,30,48,.08),0 1px 2px rgba(24,30,48,.06),0 3px 8px -3px rgba(24,30,48,.10)}
.tab[aria-selected=true]>.i{color:var(--accent)}
.tab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--ink-3);opacity:0}
.tab:hover .x,.tab[aria-selected=true] .x{opacity:1}
.tab .x:hover{background:var(--press);color:var(--ink)}
.tab .x .i{width:11px;height:11px;color:inherit}
.tab.fixed{padding-right:12px}
.top .grow{flex:1;min-width:8px}
.sep{width:1px;height:14px;background:var(--line-2);margin:0 4px;flex:none}
.pill{font-size:11px;color:var(--ink-3);padding:2px 8px;border-radius:999px;box-shadow:0 0 0 1px var(--line-2);background:rgba(255,255,255,.4);white-space:nowrap}

.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 10px}
.rail .rb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);position:relative}
.rail .rb:hover{background:var(--hover);color:var(--ink)}
.rail .rb[aria-current=page]{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.86));color:var(--accent);box-shadow:0 0 0 1px rgba(24,30,48,.08),0 1px 2px rgba(24,30,48,.06),0 6px 12px -6px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 1px 0 #fff}
.rail .rb .i{width:18px;height:18px}
.rail .mid{flex:1}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000));color:#fff;font:600 11px/26px var(--ui);text-align:center;margin-top:4px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}

/* ===== 上下文侧栏 ===== */
.ctx{width:240px;margin:0 8px 8px 0;border-radius:12px;background:rgba(247,249,250,.92);backdrop-filter:blur(28px) saturate(125%);-webkit-backdrop-filter:blur(28px) saturate(125%);border:1px solid rgba(54,60,74,.13);box-shadow:inset 1px 1px 0 #ffffffc7,0 1px 2px rgba(24,30,48,.05),0 12px 28px -16px rgba(24,30,48,.16);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ctx-h{display:flex;align-items:center;gap:6px;height:48px;padding:0 8px 0 14px}
.ctx-h strong{font-size:14px;font-weight:600;letter-spacing:-.01em}
.ctx-scroll{flex:1;min-height:0;overflow:auto;padding:0 8px 8px;scrollbar-width:thin;scrollbar-color:rgba(24,30,48,.15) transparent}
.nv{width:100%;height:30px;display:flex;align-items:center;gap:9px;padding:0 8px;border-radius:7px;color:var(--ink-2);text-align:left;font-weight:450;position:relative;border:1px solid transparent;white-space:nowrap}
.nv .i{color:var(--ink-3);width:15px;height:15px}
.nv:hover{background:var(--hover);color:var(--ink)}
.nv[aria-current=page]{background:linear-gradient(#ffffffb0,#ffffff65);border-color:#dfe2e9;box-shadow:0 1px 2px #21273506,inset 0 1px #fff;color:#283344;font-weight:600}
.nv[aria-current=page]>.i{color:var(--accent)}
.nv .lbl-t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.nv .n{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:400}
.nv[data-drop]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.lbl{display:flex;align-items:center;gap:4px;margin:14px 4px 6px;padding:14px 4px 0;border-top:1px solid var(--line);font-size:11px;font-weight:500;color:var(--ink-3)}
.lbl.first{margin-top:2px;padding-top:0;border-top:0}
.lbl .ib{width:20px;height:20px;margin-left:auto;border-radius:5px}
.lbl .ib .i{width:12px;height:12px}
.lbl button.lbtg{display:inline-flex;align-items:center;gap:4px;color:inherit;font:inherit}
.lbl button.lbtg .i{width:11px;height:11px;transition:transform .12s}
.lbl button.lbtg[aria-expanded=false] .i{transform:rotate(-90deg)}
.tr{display:flex;align-items:center;position:relative}
.tr .nv{padding-left:calc(8px + var(--d,0)*14px + 16px)}
.tr .tw{position:absolute;left:calc(2px + var(--d,0)*14px);top:50%;margin-top:-9px;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--ink-4);z-index:1}
.tr .tw:hover{background:var(--press);color:var(--ink-2)}
.tr .tw .i{width:11px;height:11px;transition:transform .12s}
.tr .tw[aria-expanded=true] .i{transform:rotate(90deg)}
.tr .nv .i.fo{margin-left:0}
.tagdot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.nv .tagdot{margin:0 3.5px}
.ctx-f{padding:6px 8px 8px;border-top:1px solid var(--line)}
.local{display:flex;align-items:center;gap:6px;padding:6px 8px 0;font-size:11px;color:var(--ink-3)}
.local i{width:6px;height:6px;border-radius:50%;background:#2fb26b;box-shadow:0 0 0 3px rgba(47,178,107,.16)}

/* ===== 功能页面 ===== */
.page{margin:0 8px 8px 0;border-radius:12px;background:var(--page);box-shadow:var(--sh-page);display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;container-type:inline-size}
.ph{display:flex;align-items:center;gap:10px;height:52px;padding:0 20px;flex:none}
.ph .ttl{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px;color:var(--ink-3)}
.ph .ttl>.i{color:var(--accent);width:16px;height:16px;margin-right:2px}
.ph .ttl button.cr{color:var(--ink-3);border-radius:6px;padding:2px 5px;margin:0 -2px;white-space:nowrap}
.ph .ttl button.cr:hover{background:var(--hover);color:var(--ink)}
.ph .ttl b{font-weight:600;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .ttl .sl{color:var(--ink-4)}
.ph .cnt{font-size:11.5px;color:var(--ink-3);padding:1px 7px;border-radius:999px;background:rgba(24,30,48,.05);font-variant-numeric:tabular-nums;margin-left:2px}
.ph .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:7px;font-weight:500;font-size:12.5px;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 80%,#000),0 1px 2px rgba(24,30,48,.2),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.pri .i{width:14px;height:14px}
.btn.ghost{color:var(--ink-2);box-shadow:0 0 0 1px var(--line-2);background:#fff}
.btn.ghost:hover{color:var(--ink);box-shadow:0 0 0 1px rgba(24,30,48,.2)}
.btn.ghost .i{width:14px;height:14px;color:var(--ink-3)}
.btn.dng{background:var(--danger);color:#fff;box-shadow:0 0 0 1px #9c2b2b,0 1px 2px rgba(24,30,48,.2),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.dng:hover{filter:brightness(1.06)}
.btn.plain{color:var(--ink-2)}.btn.plain:hover{background:var(--hover);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.split{display:inline-flex}
.split .btn:first-child{border-radius:7px 0 0 7px}
.split .btn:last-child{border-radius:0 7px 7px 0;padding:0 7px;margin-left:1px}
.split .btn:last-child .i{width:12px;height:12px;color:inherit}

.pt{display:flex;align-items:center;gap:6px;height:44px;padding:0 20px;border-top:1px solid var(--line);flex:none}
.pt .grow{flex:1;min-width:6px}
.vt{display:inline-flex;align-items:center;gap:2px;margin-right:6px}
.vt button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;color:var(--ink-2);font-size:12.5px;font-weight:450}
.vt button:hover{background:var(--hover);color:var(--ink)}
.vt button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 0 0 1px rgba(24,30,48,.08),0 1px 2px rgba(24,30,48,.06)}
.vt .c{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:400}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;color:var(--ink-2);font-size:12.5px;font-weight:450;white-space:nowrap}
.tbtn .i{width:14px;height:14px;color:var(--ink-3)}
.tbtn:hover,.tbtn[aria-expanded=true]{background:var(--hover);color:var(--ink)}
.tbtn .v{color:var(--ink);font-weight:500}
.sbox{display:flex;align-items:center;gap:6px;height:28px;width:200px;padding:0 8px;border-radius:7px;background:rgba(24,30,48,.045);color:var(--ink-3);transition:width .16s var(--ease),background .12s,box-shadow .12s}
.sbox:hover{background:rgba(24,30,48,.06)}
.sbox:focus-within{width:260px;background:#fff;box-shadow:0 0 0 1px var(--accent-line),0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.sbox .i{width:14px;height:14px}
.sbox input{all:unset;flex:1;min-width:0;font-size:12.5px;color:var(--ink)}
.sbox input::placeholder{color:var(--ink-3)}
.sbox .x{width:16px;height:16px;border-radius:4px;display:grid;place-items:center}.sbox .x:hover{background:var(--press);color:var(--ink)}.sbox .x .i{width:11px}
.sbox kbd{margin-left:auto}
kbd{font:500 10.5px var(--mono);padding:1px 5px;border-radius:4px;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 1px 0 var(--line-2);color:var(--ink-2)}

.pc{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 20px 8px;flex:none;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:stretch;height:26px;border-radius:7px;background:#fff;box-shadow:0 0 0 1px var(--line-2);font-size:12px;overflow:hidden}
.fchip>*{display:inline-flex;align-items:center;gap:5px;padding:0 8px;color:var(--ink-3)}
.fchip>*+*{box-shadow:inset 1px 0 0 var(--line)}
.fchip button:hover{background:var(--hover);color:var(--ink)}
.fchip .val{color:var(--ink);font-weight:500}
.fchip .x{padding:0 6px}.fchip .x .i{width:11px;height:11px}
.fchip .i{width:12px;height:12px}
.fclear{font-size:12px;color:var(--ink-3);padding:0 6px;height:26px;border-radius:6px}.fclear:hover{color:var(--ink);background:var(--hover)}
.notice{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);width:100%;padding:8px 0 0}
.notice .i{color:var(--ink-3);width:14px;height:14px}
.notice .grow{flex:1}
.loadbar{height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:ld 1s linear infinite;flex:none;opacity:0}
.loadbar.on{opacity:.8}
@keyframes ld{from{background-position:-40% 0}to{background-position:140% 0}}

/* 列表 */
.lw{flex:1;min-height:0;overflow:auto;container-type:inline-size;scrollbar-width:thin;scrollbar-color:rgba(24,30,48,.15) transparent;border-top:1px solid var(--line);outline:0;position:relative}
.lw[data-dropbg]{box-shadow:inset 0 0 0 2px var(--accent-line);background:var(--accent-soft)}
.gh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:32px;padding:0 20px;font-size:12px;font-weight:500;color:var(--ink-2);background:#f4f6f8f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.gh .c{color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.gh .i{width:13px;height:13px;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px 0 20px;border-bottom:1px solid var(--line);cursor:default;position:relative;outline:0}
.row:hover{background:var(--hover)}
.row[data-sel]{background:var(--accent-soft)}
.row[data-sel]:hover{background:color-mix(in srgb,var(--accent) 12%,#fff)}
.row:focus-visible{outline:0;box-shadow:inset 0 0 0 2px var(--accent-line)}
.row[data-drop]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.row[data-drag]{opacity:.45}
.row.flash,.card.flash{animation:fl 1.8s var(--ease)}
@keyframes fl{0%,35%{background:color-mix(in srgb,var(--accent) 18%,#fff)}100%{background:transparent}}
.row[data-open]{cursor:pointer}
.cb{width:15px;height:15px;border-radius:4.5px;background:#fff;box-shadow:0 0 0 1px rgba(24,30,48,.22);display:inline-grid;place-items:center;flex:none;position:relative}
.cb:hover{box-shadow:0 0 0 1px rgba(24,30,48,.4)}
.cb[aria-checked=true],.cb[aria-checked=mixed]{background:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 80%,#000)}
.cb .i{width:11px;height:11px;stroke:#fff;stroke-width:2.4;display:none}
.cb[aria-checked=true] .i.ck{display:block}
.cb[aria-checked=mixed] .i.mx{display:block}
.chk{width:15px;flex:none;display:grid;place-items:center;opacity:0;margin-right:-2px}
.row:hover .chk,.row[data-sel] .chk,.lw[data-anysel] .chk,.row:focus-visible .chk{opacity:1}
.eic{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--ink-3)}
.eic .i{width:17px;height:17px}
.eic.folder{color:color-mix(in srgb,var(--accent) 70%,#8a8f99)}
.c-name{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;overflow:hidden}
.c-name .t{font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:80px;max-width:62%;letter-spacing:-.005em}
.c-name .s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.row.dim .t{color:var(--ink-2);font-weight:450}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.tg{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:11.5px;color:var(--ink-2);background:#fff;box-shadow:0 0 0 1px var(--line-2);white-space:nowrap;flex:none}
.tg .tagdot{width:6px;height:6px}
.tg.more{color:var(--ink-3);padding:0 6px}
.c-tags{display:flex;gap:5px;flex:none;justify-content:flex-end;min-width:0}
.c-st{width:96px;flex:none;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.st{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.st-draft{color:var(--ink-3)}.st-active{color:var(--st-active)}.st-done{color:var(--st-done)}.st-archived{color:var(--ink-4)}
.c-loc{width:132px;flex:none;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-upd{width:78px;flex:none;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-act{width:56px;flex:none;display:flex;justify-content:flex-end;gap:2px}
.c-act .ib{width:24px;height:24px;opacity:0}
.row:hover .c-act .ib,.row:focus-visible .c-act .ib,.c-act .ib[aria-expanded=true],.row[data-sel] .c-act .ib{opacity:1}
.c-act .ib .i{width:15px;height:15px}
.c-act .btn{height:24px;padding:0 8px;font-size:12px}
.c-act.rec{width:auto;gap:4px}
.fav-on{color:#e0a000}
.fav-on .i{fill:#f5b301;stroke:#e0a000}
.inl{display:inline-flex;vertical-align:-2px}
@container (max-width:900px){.c-loc{display:none}}
@container (max-width:760px){.c-st{width:24px}.c-st .lb{display:none}.c-tags .tg:nth-child(n+2){display:none}}
@container (max-width:620px){.c-tags,.c-upd{display:none}.c-name .s{display:none}.c-name .t{max-width:100%}}

/* 图标视图 */
.gv{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px;padding:6px 20px 20px}
.gh+.gv,.gv+.gh{margin-top:0}
.gsec{padding:0 0 4px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;min-height:132px;padding:14px 16px 12px;border-radius:12px;background:#fff;box-shadow:var(--sh-card);cursor:pointer;transition:box-shadow .14s var(--ease),transform .14s var(--ease);outline:0;text-align:left}
.card:hover{box-shadow:0 0 0 1px rgba(24,30,48,.12),0 1px 2px rgba(24,30,48,.05),0 8px 20px -10px rgba(24,30,48,.18);transform:translateY(-1px)}
.card:focus-visible{box-shadow:0 0 0 2px var(--accent-line),0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.card[data-sel]{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent-line)}
.card[data-drop]{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.card[data-drag]{opacity:.45}
.card .ct{display:flex;align-items:flex-start;gap:8px}
.card .ct b{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;color:var(--ink)}
.card .cs{font-size:12.5px;line-height:1.65;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card .cf{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);min-height:20px}
.card .cf .grow{flex:1}
.card .cf .tg{box-shadow:0 0 0 1px var(--line)}
.card .chk{position:absolute;right:12px;top:14px;opacity:0;margin:0}
.card:hover .chk,.card[data-sel] .chk,.lw[data-anysel] .chk{opacity:1}
.card.fd{min-height:76px;flex-direction:row;align-items:center;gap:12px;background:rgba(255,255,255,.6);padding:12px 16px}
.card.fd .fic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 1px var(--accent-line);flex:none}
.card.fd .fic .i{width:19px;height:19px}
.card.fd .fx{flex:1;min-width:0}
.card.fd .fx b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.fd .fx small{color:var(--ink-3);font-size:12px}
.card .mb{position:absolute;right:8px;top:8px;opacity:0;width:24px;height:24px}
.card:hover .mb{opacity:1}
.card.fd .mb{top:50%;margin-top:-12px}
.card .chk+.mb{right:34px}

/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:84px 24px;color:var(--ink-3);gap:6px}
.empty .eb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 4px 12px -6px rgba(24,30,48,.14);color:var(--ink-3);margin-bottom:10px}
.empty .eb .i{width:20px;height:20px}
.empty b{font-size:14px;color:var(--ink);font-weight:550}
.empty p{margin:0 0 10px;font-size:12.5px;max-width:300px;line-height:1.7}

/* 底栏：分页 */
.foot{display:flex;align-items:center;gap:8px;height:40px;padding:0 20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);background:rgba(24,30,48,.014);flex:none}
.foot .grow{flex:1}
.pg{display:inline-flex;align-items:center;gap:2px}
.pg button{min-width:26px;height:26px;padding:0 6px;border-radius:6px;color:var(--ink-2);font-size:12px;font-variant-numeric:tabular-nums;display:inline-grid;place-items:center}
.pg button:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.pg button[aria-current=page]{background:#fff;color:var(--ink);font-weight:550;box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(24,30,48,.06)}
.pg button:disabled{opacity:.35;cursor:default}
.pg .i{width:14px;height:14px}
.pg .dots{color:var(--ink-4);padding:0 2px;font-size:12px}

/* 批量条 */
.bulk{position:absolute;left:50%;bottom:56px;transform:translate(-50%,12px);display:flex;align-items:center;gap:2px;padding:5px 6px 5px 14px;border-radius:12px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);box-shadow:var(--sh-pop),inset 0 1px 0 #fff;opacity:0;pointer-events:none;transition:opacity .16s var(--ease),transform .16s var(--ease);z-index:6;white-space:nowrap;max-width:calc(100% - 24px)}
.bulk.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.bulk b{font-size:12.5px;font-weight:550;margin-right:6px;font-variant-numeric:tabular-nums}
.bulk .btn{height:28px;padding:0 9px;font-weight:450;color:var(--ink-2)}
.bulk .btn:hover{background:var(--hover);color:var(--ink)}
.bulk .btn .i{width:14px;height:14px}
.bulk .btn.d{color:var(--danger)}.bulk .btn.d:hover{background:var(--danger-soft);color:var(--danger)}
.bulk .sep{margin:0 4px}

/* 菜单 / 浮层 */
.menu{position:fixed;z-index:50;min-width:188px;max-width:300px;max-height:min(440px,calc(100vh - 24px));overflow:auto;padding:5px;border-radius:11px;background:rgba(252,252,254,.97);backdrop-filter:blur(24px);box-shadow:var(--sh-pop),inset 0 1px 0 #fff;animation:mi .12s var(--ease);transform-origin:top left}
@keyframes mi{from{opacity:0;transform:scale(.97) translateY(-3px)}}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 9px;border-radius:7px;font-size:12.5px;color:var(--ink);text-align:left;white-space:nowrap}
.mi .i{width:15px;height:15px;color:var(--ink-3)}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:0}
.mi .k{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--mono);padding-left:16px}
.mi .ck{margin-left:auto;color:var(--accent);width:14px;height:14px}
.mi.dng,.mi.dng .i{color:var(--danger)}
.mi.dng:hover{background:var(--danger-soft)}
.mi:disabled{opacity:.4;cursor:default}
.mi .cb{margin-right:-1px}
.mi .n{margin-left:auto;font-size:11px;color:var(--ink-3);padding-left:14px;font-variant-numeric:tabular-nums}
.msep{height:1px;background:var(--line);margin:5px 4px}
.mlab{padding:6px 9px 3px;font-size:11px;color:var(--ink-3);font-weight:500}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:5px 9px;font-size:12.5px;color:var(--ink-2)}
.mrow .seg{flex:none}
.sw{width:28px;height:17px;border-radius:999px;background:rgba(24,30,48,.18);position:relative;flex:none;transition:background .14s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .14s var(--ease)}
.sw[aria-checked=true]{background:var(--accent)}.sw[aria-checked=true]::after{transform:translateX(11px)}

.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,8px);display:flex;align-items:center;gap:12px;background:#262b3a;color:#fff;padding:9px 10px 9px 14px;border-radius:10px;font-size:12.5px;box-shadow:var(--sh-pop);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#ffb98f;font-weight:550;padding:2px 8px;border-radius:6px}.toast button:hover{background:rgba(255,255,255,.1)}

/* 对话框 */
dialog.pal{padding:0;border:0;border-radius:14px;width:min(520px,calc(100vw - 32px));margin-top:16vh;background:rgba(252,252,254,.96);backdrop-filter:blur(28px);box-shadow:var(--sh-pop);color:var(--ink)}
dialog.pal::backdrop{background:rgba(30,36,56,.22);backdrop-filter:blur(3px)}
.si{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.si .i{color:var(--ink-3)}
.si input{all:unset;flex:1;min-width:0;font-size:14px}
.si input::placeholder{color:var(--ink-3)}
.sr{padding:6px;max-height:300px;overflow:auto}
.rs{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px;border-radius:8px;font-size:13px}
.rs .i{color:var(--ink-3)}.rs small{margin-left:auto;color:var(--ink-3);font-size:11px}
.rs:hover,.rs:focus{background:var(--accent-soft);outline:0}
.rs:hover .i,.rs:focus .i{color:var(--accent)}
.sh{padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
dialog.dlg{margin-top:18vh;width:min(440px,calc(100vw - 32px))}
.dh{padding:18px 20px 6px}
.dh h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.dh p{margin:6px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink-3)}
.db{padding:10px 20px 6px}
.df{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px}
.df .btn{height:30px;padding:0 14px}
.fld{display:block;width:100%;height:34px;padding:0 11px;border:0;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--line-2);font-size:13.5px;outline:0}
.fld:focus{box-shadow:0 0 0 1px var(--accent-line),0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.bad{box-shadow:0 0 0 1px #e5a3a3,0 0 0 3px rgba(194,58,58,.12)}
.ferr{color:var(--danger);font-size:12px;margin-top:6px;min-height:0}
.plist{max-height:300px;overflow:auto;border-radius:9px;box-shadow:0 0 0 1px var(--line-2);background:#fff;padding:4px}
.pi{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;padding-left:calc(8px + var(--d,0)*16px);border-radius:6px;font-size:13px;color:var(--ink);text-align:left}
.pi:hover:not(:disabled){background:var(--hover)}
.pi[aria-checked=true]{background:var(--accent-soft)}
.pi:disabled{opacity:.4;cursor:default}
.pi .i{width:15px;height:15px;color:var(--ink-3)}
.pi .n{margin-left:auto;font-size:11px;color:var(--ink-3)}
.pi .ck{margin-left:auto;color:var(--accent)}
.drop{display:grid;place-items:center;gap:6px;padding:26px 16px;border-radius:10px;border:1.5px dashed var(--line-2);color:var(--ink-3);text-align:center;font-size:12.5px;background:rgba(255,255,255,.5)}
.drop .i{width:20px;height:20px}
.drop b{color:var(--ink-2);font-weight:500}

/* 笔记占位页（点击笔记后出现，仅用于演示进入编辑页） */
.nview{flex:1;overflow:auto;padding:56px 24px}
.nview .in{max-width:620px;margin:0 auto}
.nview h1{margin:10px 0 12px;font:700 30px/1.3 var(--ui);letter-spacing:-.6px}
.nview p{color:var(--ink-2);line-height:1.8;font-size:15px;margin:0 0 20px}
.quiet{padding:16px 18px;border-radius:10px;background:#fff;box-shadow:0 0 0 1px var(--line-2);color:var(--ink-2);line-height:1.8;font-size:12.5px;margin-bottom:18px}

@media (max-width:900px){
  .app{grid-template-columns:56px minmax(0,1fr)}
  .ctx{position:fixed;left:56px;top:46px;bottom:0;z-index:12;margin:0 0 8px 0;box-shadow:var(--sh-pop);background:rgba(246,247,250,.97)}
  .app.sb-off .ctx{display:none}
  .page{grid-column:2}
  .pill{display:none}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .ctx{left:0}
  .page{grid-column:1;margin:0 6px 6px}
  .ph,.pt,.pc,.foot{padding-left:12px;padding-right:12px}
  .row{padding-left:12px}
}
@container (max-width:780px){.tbtn .lb{display:none}.tbtn{padding:0 7px}.sbox{width:150px}.sbox:focus-within{width:190px}.btn.ghost .lb{display:none}.btn.ghost{padding:0 8px}}
@container (max-width:560px){.vt .lb{display:none}.sbox{width:34px;padding:0 9px}.sbox{position:relative}.sbox input{position:absolute;inset:0;opacity:0;padding-left:30px}.sbox kbd{display:none}.sbox:focus-within{width:150px}.sbox:focus-within input{position:static;opacity:1;padding:0}}
@media (min-width:901px){.app.sb-off{grid-template-columns:56px 0 minmax(0,1fr)}.app.sb-off .ctx{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div class="app" id="app">
  <header class="top">
    <button class="ib" id="sbtoggle" aria-label="收起或展开侧栏" aria-pressed="true"><svg class="i"><use href="#i-pl"/></svg></button>

var state0={scope:'all',folderId:null};
var S={scope:'all',folderId:null,type:'all',q:'',
  f:{status:[],tags:[],tagMatch:'any',updated:null},
  sort:'updated-desc',group:'type',view:'list',
  props:{summary:true,tags:true,status:true,location:true,updated:true},
  page:1,pageSize:20,sel:{},exp:{work:1,study:1},tagsOpen:true,page_:'index',open:[],lastSel:null,focus:null};
var SORTS={'updated-desc':'最近更新','updated-asc':'最早更新','name-asc':'名称 A→Z','name-desc':'名称 Z→A'};

/* ================= 数据辅助 ================= */
function fById(id){return folders.filter(function(f){return f.id===id})[0]}
function nById(id){return notes.filter(function(n){return n.id===id})[0]}
function tById(id){return tags.filter(function(t){return t.id===id})[0]}
function kids(id){return folders.filter(function(f){return f.parent===id})}
function subtree(id){var out=[id];kids(id).forEach(function(k){out=out.concat(subtree(k.id))});return out}
function fpath(id){var p=[];while(id){var f=fById(id);if(!f)break;p.unshift(f);id=f.parent}return p}
function liveNotes(){return notes.filter(function(n){return !n.deleted})}
function folderNotes(id){var ids=subtree(id);return liveNotes().filter(function(n){return ids.indexOf(n.folder)>-1})}
function folderUpd(id){var l=folderNotes(id);return l.length?Math.max.apply(null,l.map(function(n){return n.upd})):NOW-30*D}
function locText(folderId){var p=fpath(folderId);return p.length?p.map(function(f){return f.name}).join(' / '):'笔记库'}
function pad(n){return n<10?'0'+n:''+n}
function dayDiff(ts){var a=new Date(NOW),b=new Date(ts);a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.round((a-b)/D)}
function fmtDate(ts){var d=new Date(ts),k=dayDiff(ts);if(k<=0)return '今天 '+pad(d.getHours())+':'+pad(d.getMinutes());if(k===1)return '昨天';if(d.getFullYear()!==new Date(NOW).getFullYear())return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();return (d.getMonth()+1)+'月'+d.getDate()+'日'}
function bucket(ts){var k=dayDiff(ts);return k<=0?0:k===1?1:k<=7?2:k<=30?3:4}
var BUCKETS=['今天','昨天','过去 7 天','过去 30 天','更早'];
function itemOf(kind,o){
  if(kind==='folder')return {kind:'folder',id:o.id,key:'f:'+o.id,name:o.name,upd:folderUpd(o.id),count:folderNotes(o.id).length,loc:locText(o.parent),o:o};
  return {kind:'note',id:o.id,key:'n:'+o.id,name:o.title,upd:o.upd,summary:o.summary,tags:o.tags,status:o.status,fav:o.fav,loc:locText(o.folder),deleted:o.deleted,o:o};
}
function byKey(k){var a=k.split(':');return a[0]==='f'?itemOf('folder',fById(a[1])):itemOf('note',nById(a[1]))}
function scopeItems(){
  var s=S.scope,live=liveNotes(),mk=function(l){return l.map(function(n){return itemOf('note',n)})};
  if(s==='trash')return mk(notes.filter(function(n){return n.deleted}));
  if(s==='all')return mk(live);
  if(s==='recent')return mk(live.slice().sort(function(a,b){return b.upd-a.upd}).slice(0,12));
  if(s==='favorites')return mk(live.filter(function(n){return n.fav}));
  if(s==='unfiled')return mk(live.filter(function(n){return !n.folder}));
  var pid=s==='root'?null:S.folderId;
  return kids(pid).map(function(f){return itemOf('folder',f)}).concat(mk(live.filter(function(n){return n.folder===pid})));
}
function hasFilters(){var f=S.f;return f.status.length||f.tags.length||f.updated}
function passes(it){
  var q=S.q.trim().toLowerCase(),f=S.f;
  if(q){var hay=(it.name+(it.summary||'')+(it.tags||[]).map(function(t){return tById(t).name}).join(' ')).toLowerCase();if(hay.indexOf(q)<0)return false}
  if(hasFilters()){
    if(it.kind==='folder')return false;
    if(f.status.length&&f.status.indexOf(it.status)<0)return false;
    if(f.tags.length){var has=f.tags.filter(function(t){return it.tags.indexOf(t)>-1}).length;if(f.tagMatch==='all'?has<f.tags.length:has===0)return false}
    if(f.updated){var lim={today:0,'7d':7,'30d':30}[f.updated];if(dayDiff(it.upd)>lim)return false}
  }
  return true;
}
function cmpSort(a,b){
  switch(S.sort){case 'updated-asc':return a.upd-b.upd;case 'name-asc':return a.name.localeCompare(b.name,'zh-CN');case 'name-desc':return b.name.localeCompare(a.name,'zh-CN');default:return b.upd-a.upd}
}
function gInfo(it){
  if(S.scope==='trash'||S.group==='none')return {o:0,l:''};
  if(it.kind==='folder')return {o:-1,l:'文件夹'};
  if(S.group==='updated'){var b=bucket(it.upd);return {o:b,l:BUCKETS[b]}}
  if(S.group==='status'){var i=STATUS_ORDER.indexOf(it.status);return {o:i,l:STATUS[it.status]}}
  return {o:0,l:'笔记'};
}
var V={all:[],flat:[],counts:{all:0,folder:0,note:0},pageCount:1};
function compute(){
  var base=scopeItems().filter(passes);
  V.counts={all:base.length,folder:base.filter(function(i){return i.kind==='folder'}).length,note:base.filter(function(i){return i.kind==='note'}).length};
  if(S.type==='folder')base=base.filter(function(i){return i.kind==='folder'});
  if(S.type==='note')base=base.filter(function(i){return i.kind==='note'});
  base.forEach(function(i){i.g=gInfo(i)});
  base.sort(function(a,b){return a.g.o-b.g.o||(a.kind!==b.kind?(a.kind==='folder'?-1:1):0)||cmpSort(a,b)});
  V.all=base;V.pageCount=Math.max(1,Math.ceil(base.length/S.pageSize));
  if(S.page>V.pageCount)S.page=V.pageCount;if(S.page<1)S.page=1;
  V.flat=base.slice((S.page-1)*S.pageSize,S.page*S.pageSize);
}
function selKeys(){return Object.keys(S.sel)}
function selNotes(){return selKeys().filter(function(k){return k[0]==='n'&&nById(k.slice(2))})}

/* ================= 渲染 ================= */
var SCOPE_META={all:['全部笔记','file'],recent:['最近编辑','clock'],favorites:['收藏','star'],unfiled:['未整理','inbox'],trash:['回收站','trash'],root:['笔记库','book']};

}
function tagCount(id){return liveNotes().filter(function(n){return n.tags.indexOf(id)>-1}).length}
function onlyTag(){return S.f.tags.length===1&&S.scope==='all'?S.f.tags[0]:null}

    var cur=S.scope===e[0]&&!onlyTag();

  h+='<div class="lbl">文件夹<button class="ib" id="newfolder" aria-label="新建文件夹" title="新建文件夹">'+ic('plus')+'</button></div>';
  h+='<div class="tr" style="--d:0"><button class="nv" data-scope="root" data-droptarget="" '+(S.scope==='root'?'aria-current="page"':'')+'>'+ic('book')+'<span class="lbl-t">笔记库</span><span class="n">'+liveNotes().length+'</span></button></div>';
  (function tree(pid,d){kids(pid).forEach(function(f){
    var k=kids(f.id).length,op=!!S.exp[f.id],cur=S.scope==='folder'&&S.folderId===f.id;
    h+='<div class="tr" style="--d:'+(d+1)+'">'+(k?'<button class="tw" data-tw="'+f.id+'" aria-expanded="'+op+'" aria-label="展开或收起 '+esc(f.name)+'">'+ic('chev-r')+'</button>':'')+
      '<button class="nv" data-folder="'+f.id+'" data-droptarget="'+f.id+'" '+(cur?'aria-current="page"':'')+'>'+ic('folder')+'<span class="lbl-t">'+esc(f.name)+'</span><span class="n">'+folderNotes(f.id).length+'</span></button></div>';
    if(k&&op)tree(f.id,d+1)})})(null,0);
  h+='<div class="lbl"><button class="lbtg" id="tagtg" aria-expanded="'+S.tagsOpen+'">'+ic('chev')+'标签 '+tags.length+'</button></div>';
  if(S.tagsOpen)h+=tags.map(function(t){return '<button class="nv" data-tag="'+t.id+'" '+(onlyTag()===t.id?'aria-current="page"':'')+'><i class="tagdot" style="--c:'+t.c+'"></i><span class="lbl-t">'+t.name+'</span><span class="n">'+tagCount(t.id)+'</span></button>'}).join('');
  $('#side').innerHTML=h;
  $('#sidefoot').innerHTML='<button class="nv" data-scope="trash" '+(S.scope==='trash'?'aria-current="page"':'')+'>'+ic('trash')+'<span class="lbl-t">回收站</span><span class="n">'+count('trash')+'</span></button><div class="local"><i></i>本地已同步</div>';
}

  var m=scopeTitle(),trail='';

    var p=fpath(S.scope==='folder'?S.folderId:null),parts=[{name:'笔记库',id:null}].concat(p.map(function(f){return {name:f.name,id:f.id}}));
    trail=parts.map(function(x,i){var last=i===parts.length-1;return (i?'<span class="sl">/</span>':'')+(last?'<b>'+esc(x.name)+'</b>':'<button class="cr" data-crumb="'+(x.id||'')+'">'+esc(x.name)+'</button>')}).join('');

var openMenu=null;
function closeMenu(){if(openMenu){var o=openMenu;openMenu=null;o.el.remove();document.removeEventListener('mousedown',o.out,true);document.removeEventListener('keydown',o.key,true);window.removeEventListener('resize',closeMenu);if(o.trigger){o.trigger.removeAttribute('aria-expanded');if(o.restore&&document.contains(o.trigger))o.trigger.focus()}if(o.onClose)o.onClose()}}
function showMenu(anchor,build,o){
  o=o||{};closeMenu();
  var el=document.createElement('div');el.className='menu';el.setAttribute('role','menu');el.style.minWidth=(o.minWidth||188)+'px';
  var trigger=anchor&&anchor.nodeType?anchor:null;if(trigger)trigger.setAttribute('aria-expanded','true');
  var items=[];
  function paint(keepIdx){
    items=build();
    el.innerHTML=items.map(function(it,i){
      if(it.t==='sep')return '<div class="msep" role="separator"></div>';
      if(it.t==='label')return '<div class="mlab">'+it.text+'</div>';
      if(it.t==='seg')return '<div class="mrow"><span>'+it.label+'</span><span class="seg" role="group">'+it.opts.map(function(p,j){return '<button data-mi="'+i+'" data-sv="'+j+'" aria-pressed="'+(it.val===p.v)+'">'+p.l+'</button>'}).join('')+'</span></div>';
      if(it.t==='toggle')return '<button class="mi" role="menuitemcheckbox" aria-checked="'+it.on+'" data-mi="'+i+'"><span>'+it.label+'</span><span class="sw" style="margin-left:auto" aria-checked="'+it.on+'"></span></button>';
      var lead=it.box!==undefined?'<span class="cb" role="presentation" aria-checked="'+it.box+'">'+ic('check','ck')+ic('minus','mx')+'</span>':(it.dot?'<i class="tagdot" style="--c:'+it.dot+'"></i>':(it.icon?ic(it.icon):''));
      return '<button class="mi'+(it.danger?' dng':'')+'" role="menuitem'+(it.radio?'radio':'')+'" '+(it.radio?'aria-checked="'+!!it.checked+'"':'')+' data-mi="'+i+'" '+(it.disabled?'disabled':'')+'>'+(it.st||lead)+'<span>'+it.label+'</span>'+(it.k?'<span class="k">'+it.k+'</span>':'')+(it.n!==undefined?'<span class="n">'+it.n+'</span>':'')+(it.checked&&!it.box?ic('check','ck'):'')+'</button>';
    }).join('');
    if(keepIdx!=null){var b=el.querySelector('[data-mi="'+keepIdx+'"]');b&&b.focus&&b.focus()}
  }
  paint();document.body.appendChild(el);
  var r=anchor&&anchor.getBoundingClientRect?anchor.getBoundingClientRect():{left:anchor.x,right:anchor.x,top:anchor.y,bottom:anchor.y,width:0};
  var mw=el.offsetWidth,mh=el.offsetHeight,x=o.align==='right'?r.right-mw:r.left,y=r.bottom+(anchor&&anchor.nodeType?6:2);
  if(x+mw>innerWidth-8)x=innerWidth-mw-8;if(x<8)x=8;if(y+mh>innerHeight-8)y=Math.max(8,(anchor&&anchor.nodeType?r.top-6:innerHeight-8)-mh);
  el.style.left=x+'px';el.style.top=y+'px';
  var self={el:el,trigger:trigger,restore:true,onClose:o.onClose};
  self.out=function(e){if(!el.contains(e.target)&&!(trigger&&trigger.contains(e.target)))closeMenu()};
  self.key=function(e){
    var bs=$$('.mi:not(:disabled)',el),i=bs.indexOf(document.activeElement);
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeMenu()}
    else if(e.key==='ArrowDown'){e.preventDefault();(bs[i+1]||bs[0]).focus()}
    else if(e.key==='ArrowUp'){e.preventDefault();(bs[i-1]||bs[bs.length-1]).focus()}
  };
  el.addEventListener('click',function(e){
    var b=e.target.closest('[data-mi]');if(!b||b.disabled)return;
    var it=items[+b.dataset.mi];if(!it)return;
    if(it.t==='seg'){it.set(it.opts[+b.dataset.sv].v);paint(+b.dataset.mi);return}
    if(it.t==='toggle'){it.set(!it.on);paint(+b.dataset.mi);return}
    if(it.keep){it.run&&it.run();paint(+b.dataset.mi);return}
    self.restore=!it.noRestore;closeMenu();it.run&&it.run();
  });
  openMenu=self;
  setTimeout(function(){document.addEventListener('mousedown',self.out,true);document.addEventListener('keydown',self.key,true);window.addEventListener('resize',closeMenu);
    if(!o.noFocus){var f=$('.mi:not(:disabled)',el);f&&f.focus()}},0);
  return self;
}

function openFilter(anchor,dim){

  var m=showMenu(anchor,function(){
    var f=S.f;
    if(lv==='root')return [
      {label:'状态',icon:'circle',k:f.status.length?f.status.length+'':'',run:function(){lv='status';m.rebuild()},keep:true},
      {label:'标签',icon:'tag',k:f.tags.length?f.tags.length+'':'',run:function(){lv='tags';m.rebuild()},keep:true},
      {label:'更新时间',icon:'calendar',k:f.updated?'1':'',run:function(){lv='updated';m.rebuild()},keep:true}];
    var back={label:'返回',icon:'chev-l',keep:true,run:function(){lv='root';m.rebuild()}};
    if(lv==='status')return [back,{t:'sep'}].concat(STATUS_ORDER.map(function(s){return {label:STATUS[s],st:STSVG[s],box:f.status.indexOf(s)>-1,keep:true,n:liveNotes().filter(function(n){return n.status===s}).length,run:function(){toggleIn(f.status,s);rerender()}}}));
    if(lv==='tags')return [back,{t:'sep'},{t:'seg',label:'匹配',val:f.tagMatch,opts:[{v:'any',l:'任一'},{v:'all',l:'全部'}],set:function(v){f.tagMatch=v;rerender()}},{t:'sep'}].concat(tags.map(function(t){return {label:t.name,dot:t.c,box:f.tags.indexOf(t.id)>-1,keep:true,n:tagCount(t.id),run:function(){toggleIn(f.tags,t.id);S.scope==='all'||0;rerender()}}}));
    return [back,{t:'sep'},{label:'不限',radio:1,checked:!f.updated,keep:true,run:function(){f.updated=null;rerender()}}].concat(Object.keys(UPD_LABEL).map(function(k){return {label:UPD_LABEL[k],radio:1,checked:f.updated===k,keep:true,run:function(){f.updated=k;rerender()}}}));
  },{minWidth:212});
  // 简易重绘：重新打开同一锚点内容（不关闭）
  m.rebuild=function(){var cur=m.el;var pos=[cur.style.left,cur.style.top];var b=cur.querySelectorAll('.mi');
    // 通过触发 click 之外的路径重绘：复用 showMenu 的内部 paint 不可达，故重新创建
    var keep=m;openMenu=null;document.removeEventListener('mousedown',keep.out,true);document.removeEventListener('keydown',keep.key,true);window.removeEventListener('resize',closeMenu);keep.el.remove();
    var n=openFilter(anchor,lv);n.el.style.left=pos[0];n.el.style.top=pos[1]};
  return m;
}

function setScope(scope,folderId){

function createNote(parentId,title){

function movePicker(keys){

  function list(){

    (function t(pid,d){kids(pid).forEach(function(f){var dis=banned[f.id];h+='<button class="pi" role="radio" style="--d:'+d+'" data-pick="'+f.id+'" aria-checked="'+(pick===f.id)+'" '+(dis?'disabled':'')+'>'+ic('folder')+esc(f.name)+(cur===f.id?'<span class="n">当前位置</span>':'')+(pick===f.id?ic('check','ck'):'')+'</button>';t(f.id,d+1)})})(null,1);
    return '<div class="plist" role="radiogroup" aria-label="目标位置">'+h+'</div>';
  }
  dialog({title:'移动 '+keys.length+' 项到…',desc:'文件夹不能移动到它自己的子级里。',body:list,pick:function(v){pick=v;return list()},ok:'移动',okDisabled:function(){return pick===undefined||pick===cur},
    run:function(){moveItems(keys,pick)}});
}
function tagPicker(ids){
  var st={};tags.forEach(function(t){var c=ids.filter(function(id){return nById(id).tags.indexOf(t.id)>-1}).length;st[t.id]=c===0?'false':c===ids.length?'true':'mixed';});

    run:function(){commit('已更新 '+ids.length+' 篇笔记的标签',function(){tags.forEach(function(t){if(st[t.id]===orig[t.id])return;ids.forEach(function(id){var n=nById(id),i=n.tags.indexOf(t.id);if(st[t.id]==='true'&&i<0)n.tags.push(t.id);if(st[t.id]==='false'&&i>-1)n.tags.splice(i,1)})})})}});

function selectRange(key){

document.addEventListener('contextmenu',function(e){
  var r=e.target.closest('#lw [data-key]');
  if(r){e.preventDefault();var key=r.dataset.key;S.focus=key;showMenu({x:e.clientX,y:e.clientY},function(){return itemMenu(key)},{});return}
  if(e.target.closest('#lw')&&S.scope!=='trash'){e.preventDefault();showMenu({x:e.clientX,y:e.clientY},function(){return [{label:'新建笔记',icon:'edit',run:function(){newName('note',curParent(),function(n){createNote(curParent(),n)})}},{label:'新建文件夹',icon:'folder-plus',run:function(){newName('folder',curParent(),function(n){commit('已新建文件夹「'+n+'」',function(){folders.push({id:'f'+Date.now(),name:n,parent:curParent()})})})}},{t:'sep'},{label:'导入 Markdown…',icon:'upload',run:importDialog}]},{})}
});
/* 搜索输入（不重绘输入框本身，避免丢失焦点与输入法） */
var composing=false,sqT;
document.addEventListener('compositionstart',function(e){if(e.target.id==='sq')composing=true});
document.addEventListener('compositionend',function(e){if(e.target.id==='sq'){composing=false;onSq()}});
document.addEventListener('input',function(e){if(e.target.id==='sq'&&!composing)onSq();if(e.target.id==='q'&&e.target.closest('#pal'))search()});
function onSq(){
  S.q=$('#sq').value;S.page=1;
  var had=!!$('#sqx');var lb=$('.sbox');
  if(!!S.q!==had){var x=lb.querySelector('.x'),k=lb.querySelector('kbd');if(S.q&&k){k.outerHTML='<button class="x" id="sqx" aria-label="清除搜索">'+ic('x')+'</button>'}else if(!S.q&&x){x.outerHTML='<kbd>/</kbd>'}}
  $('#loadbar').classList.add('on');clearTimeout(sqT);sqT=setTimeout(function(){$('#loadbar').classList.remove('on')},260);
  renderPartial();
}
/* 键盘 */
document.addEventListener('keydown',function(e){
  var inField=/^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#pal').open&&!$('#dlg').open)openSearch();return}
  if($('#pal').open||$('#dlg').open||$('#about').open||openMenu)return;
  if(e.key==='/'&&!inField&&S.page_==='index'){e.preventDefault();var s=$('#sq');s&&s.focus();return}
  if(e.target.id==='sq'){if(e.key==='Escape'){if(S.q){S.q='';renderHead();renderPartial()}e.target.blur();var f=$('[data-key]');f&&f.focus()}if(e.key==='ArrowDown'){e.preventDefault();var f2=$('[data-key]');f2&&f2.focus()}return}
  if(inField||S.page_!=='index')return;
  if(e.key==='Escape'&&selKeys().length){S.sel={};renderList();renderBulk();return}
  var row=e.target.closest&&e.target.closest('[data-key]');
  if(!row)return;
  var rows=$$('[data-key]'),i=rows.indexOf(row),key=row.dataset.key;
  var grid=S.view==='grid',cols=1;
  if(grid){var tops=rows.map(function(r){return r.offsetTop});var first=tops[0];cols=tops.filter(function(t){return t===first}).length||1}
  function go(n){e.preventDefault();var t=rows[Math.max(0,Math.min(rows.length-1,n))];if(t){S.focus=t.dataset.key;rows.forEach(function(r){r.tabIndex=-1});t.tabIndex=0;t.focus();t.scrollIntoView({block:'nearest'})}}
  if(e.key==='ArrowDown')go(i+(grid?cols:1));
  else if(e.key==='ArrowUp')go(i-(grid?cols:1));
  else if(grid&&e.key==='ArrowRight')go(i+1);
  else if(grid&&e.key==='ArrowLeft')go(i-1);
  else if(e.key==='Home')go(0);else if(e.key==='End')go(rows.length-1);
  else if(e.key==='Enter'&&S.scope!=='trash'&&!e.target.closest('button:not([data-key])')){e.preventDefault();key[0]==='f'?setScope('folder',key.slice(2)):openNote(key.slice(2))}
  else if(e.key.toLowerCase()==='x'||e.key===' '&&!e.target.closest('button')){e.preventDefault();toggleSel(key,e.shiftKey)}
  else if(e.key==='F2'&&S.scope!=='trash'){e.preventDefault();rename(key)}
  else if((e.key==='Backspace'||e.key==='Delete')&&S.scope!=='trash'&&key[0]==='n'){e.preventDefault();var ks=S.sel[key]&&selKeys().length>1?selNotes():[key];trashNotes(ks.map(function(k){return k.slice(2)}))}
  else if(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10')){e.preventDefault();var rc=row.getBoundingClientRect();showMenu({x:rc.left+40,y:rc.bottom},function(){return itemMenu(key)},{})}
});
/* 对话框事件 */
document.addEventListener('click',function(e){
  var d=$('#dlg');if(!d.open||!d.contains(e.target))return;
  if(e.target.closest('[data-dclose]')){d.close();return}
  if(e.target.closest('#dok')){dlgOk();return}
  var o=dlgState,c;
  if((c=e.target.closest('[data-pick]'))){$('#dbody').innerHTML=o.pick(c.dataset.pick===''?null:c.dataset.pick);o.upd();return}
  if((c=e.target.closest('[data-tagpick]'))){$('#dbody').innerHTML=o.tagpick(c.dataset.tagpick);return}
  if((c=e.target.closest('[data-filepick]'))){$('#dbody').innerHTML=o.filepick(+c.dataset.filepick);o.upd();return}
});
$('#dlg').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='dinp'){e.preventDefault();dlgOk()}});
$('#dlg').addEventListener('input',function(e){if(e.target.id==='dinp'){e.target.classList.remove('bad');$('#derr').textContent=''}});
$$('dialog').forEach(function(d){d.addEventListener('click',function(e){if(e.target===d){var r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}})});

/* 拖拽移动：笔记/文件夹 → 文件夹行 / 侧栏文件夹 / 笔记库 */
var drag=null;
document.addEventListener('dragstart',function(e){
  var r=e.target.closest&&e.target.closest('#lw [data-key]');if(!r)return;
  var key=r.dataset.key,keys=S.sel[key]&&selKeys().length>1?selKeys():[key];
  drag={keys:keys};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',keys.join(','));
  keys.forEach(function(k){var el=$('#lw [data-key="'+k+'"]');el&&el.setAttribute('data-drag','')});
  closeMenu();
});
document.addEventListener('dragend',function(){drag=null;$$('[data-drag]').forEach(function(x){x.removeAttribute('data-drag')});$$('[data-drop]').forEach(function(x){x.removeAttribute('data-drop')});$('#lw').removeAttribute('data-dropbg')});
function dropOk(targetId){
  if(!drag)return false;
  var ok=true;drag.keys.forEach(function(k){if(k[0]==='f'){var id=k.slice(2);if(targetId&&subtree(id).indexOf(targetId)>-1)ok=false;if(fById(id).parent===(targetId||null))ok=false}else if(nById(k.slice(2)).folder===(targetId||null))ok=false});
  return ok;
}
document.addEventListener('dragover',function(e){
  if(!drag)return;
  var t=e.target.closest('[data-droptarget]'),bg=!t&&e.target.closest('#lw')&&(S.scope==='folder');
  $$('[data-drop]').forEach(function(x){if(x!==t)x.removeAttribute('data-drop')});
  if(t){var id=t.dataset.droptarget||null;if(dropOk(id)){e.preventDefault();t.setAttribute('data-drop','')}}
  $('#lw').toggleAttribute('data-dropbg',false);
});
document.addEventListener('drop',function(e){
  if(!drag)return;var t=e.target.closest('[data-droptarget]');
  if(t){var id=t.dataset.droptarget||null;if(dropOk(id)){e.preventDefault();var ks=drag.keys;drag=null;moveItems(ks,id)}}
});

/* 全局搜索面板 */
var lastFocus=null;
function search(){var q=$('#q').value.trim().toLowerCase();var r=liveNotes().filter(function(n){return (n.title+n.tags.map(function(t){return tById(t).name}).join('')+n.summary).toLowerCase().indexOf(q)>-1}).slice(0,30);
  $('#sr').innerHTML=r.length?r.map(function(n){return '<button class="rs" data-pnote="'+n.id+'">'+ic('file')+'<span>'+esc(n.title||'未命名笔记')+'</span><small>'+esc(locText(n.folder))+'</small></button>'}).join(''):'<div class="empty" style="padding:26px">没有找到相关笔记，换个关键词试试。</div>'}
function openSearch(){lastFocus=document.activeElement;$('#q').value='';search();$('#pal').showModal();$('#q').focus()}
$('#pal').addEventListener('click',function(e){var b=e.target.closest('[data-pnote]');if(b){$('#pal').close();openNote(b.dataset.pnote)}});
$('#pal').addEventListener('keydown',function(e){var it=$$('.rs'),i=it.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();(it[i+1]||it[0])&&(it[i+1]||it[0]).focus()}if(e.key==='ArrowUp'){e.preventDefault();var p=it[i-1]||it[it.length-1];p&&p.focus()}if(e.key==='Enter'&&document.activeElement===$('#q')){e.preventDefault();it[0]&&it[0].click()}});
$('#pal').addEventListener('close',function(){lastFocus&&document.contains(lastFocus)&&lastFocus.focus()});
$('#more').onclick=function(){$('#about').showModal()};$('#aboutx').onclick=function(){$('#about').close()};
function setSb(on){$('#app').classList.toggle('sb-off',!on);$('#sbtoggle').setAttribute('aria-pressed',String(on))}
$('#sbtoggle').onclick=function(){setSb($('#app').classList.contains('sb-off'))};
$('#back').onclick=function(){goHist(-1)};$('#fwd').onclick=function(){goHist(1)};
var narrow=matchMedia('(max-width:900px)');
if(narrow.matches)setSb(false);
narrow.addEventListener('change',function(e){setSb(!e.matches)});

/* 对话框关闭后清理 */
$('#dlg').addEventListener('close',function(){dlgState=null});
/* 初始化 */
render();pushHist();
</script>
</body>
</html>
