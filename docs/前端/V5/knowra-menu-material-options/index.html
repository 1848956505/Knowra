\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2Z\"></path></svg>","panel":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" focusable=\"false\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"></rect><path d=\"M15 3v18\"></path></svg>"}</script>
<script>
const icons=JSON.parse(document.getElementById('iconData').textContent);
const materials=[
 {id:'pearl',number:'01',name:'柔白瓷面',en:'SOFT PORCELAIN',description:'细腻的实色表面，顶边留一点亮光；投影柔和、轮廓干净，更接近当前界面。'},
 {id:'glass',number:'02',name:'通透玻璃',en:'CLEAR GLASS',badge:'推荐',description:'薄亮边、半透明表面与分层投影，让背景隐约透过。与刚选定的新建按钮更协调。'},
 {id:'acrylic',number:'03',name:'磨砂亚克力',en:'FROSTED ACRYLIC',description:'更厚一点的乳白磨砂，把背景化成柔和色块；保留通透感，同时更突出菜单文字。'},
 {id:'alloy',number:'04',name:'细边金属',en:'FINE ALLOY',description:'细灰边与内侧亮线形成薄薄的包边，投影更紧。边界清晰，更像精密的桌面控件。'}
];
const statusItems=[['active','进行中',4],['draft','草稿',8],['completed','已完成',9],['published','已发布',3],['archived','已归档',2]];
const tagItems=[['study','学习',12,'#7b9bc8'],['design','设计',8,'#ca946b'],['work','工作',5,'#859b81'],['ideas','灵感',3,'#a28cb6']];
const dateItems=[['','不限'],['today','今天'],['7d','过去 7 天'],['30d','过去 30 天']];
let material='glass',level='root',isOpen=true,match='any',updated='',statuses=new Set(),tags=new Set();
const menu=document.getElementById('liveMenu'),trigger=document.getElementById('filterTrigger');
const icon=(name,cls='')=>icons[name].replace('<svg ',`<svg class="${cls}" `);
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icons[el.dataset.icon]);
document.getElementById('folders').innerHTML=[['学习资料','12 项'],['产品设计','8 项'],['项目记录','5 项'],['灵感随记','3 项']].map(([name,count])=>`<div class="folder-card"><div class="folder-top">${icons.folder}</div><div class="folder-copy"><strong>${name}</strong><span>${count}</span></div></div>`).join('');
function rootRows(interactive=true){return [['status','状态','status',statuses.size],['tags','标签','tag',tags.size],['updated','更新时间','calendar',updated?1:0]].map(([key,label,glyph,count])=>{const body=`<span class="row-icon">${icons[glyph]}</span><span class="row-label">${label}</span>${interactive&&count?`<span class="selection-count">${count}</span>`:''}${icon('right','chevron')}`;return interactive?`<button class="row" role="menuitem" data-level="${key}">${body}</button>`:`<div class="row">${body}</div>`}).join('')}
function renderMenu(focusFirst=false){menu.hidden=!isOpen;trigger.setAttribute('aria-expanded',String(isOpen));menu.dataset.material=material;menu.setAttribute('aria-label',level==='root'?'筛选维度':level==='status'?'状态':level==='tags'?'标签':'更新时间');
 let content='';
 const back=`<button class="row menu-back" role="menuitem" data-back><span class="row-icon">${icons.left}</span><span class="row-label">返回筛选</span></button><hr class="separator">`;
 if(level==='root')content=rootRows();
 if(level==='status')content=back+statusItems.map(([id,name,count])=>`<button class="row" role="menuitemcheckbox" aria-checked="${statuses.has(id)}" data-status="${id}"><span class="row-icon">${icons.status}</span><span class="row-label">${name}</span><span class="count">${count}</span>${statuses.has(id)?icon('check','tick'):''}</button>`).join('');
 if(level==='tags')content=back+`<div class="match"><span>匹配标签</span><div class="seg" aria-label="多标签匹配方式"><button data-match="any" aria-pressed="${match==='any'}">任一</button><button data-match="all" aria-pressed="${match==='all'}">全部</button></div></div><hr class="separator">`+tagItems.map(([id,name,count,color])=>`<button class="row" role="menuitemcheckbox" aria-checked="${tags.has(id)}" data-tag="${id}"><span class="checkbox-mark" data-checked="${tags.has(id)}">${tags.has(id)?icons.check:''}</span><span class="color-dot" style="--dot-color:${color}"></span><span class="row-label">${name}</span><span class="count">${count}</span></button>`).join('');
 if(level==='updated')content=back+dateItems.map(([id,name])=>`<button class="row" role="menuitemradio" aria-checked="${updated===id}" data-date="${id}"><span class="row-label">${name}</span>${updated===id?icon('check','tick'):''}</button>`).join('');
 menu.innerHTML=`<div class="menu-list">${content}</div>`;renderSummary();if(focusFirst&&isOpen)menu.querySelector('[role^="menuitem"]')?.focus({preventScroll:true});
}
function renderSummary(){const labels=[...statusItems.filter(([id])=>statuses.has(id)).map(([,label])=>`状态：${label}`),...tagItems.filter(([id])=>tags.has(id)).map(([,label])=>`标签：${label}`),...(updated?[`更新：${dateItems.find(([id])=>id===updated)[1]}`]:[])];document.getElementById('filterSummary').innerHTML=labels.length?labels.map(label=>`<span class="summary-chip">${label}</span>`).join(''):'尚未添加筛选条件';document.getElementById('clearFilters').hidden=!labels.length}
document.getElementById('options').innerHTML=materials.map(v=>`<article class="option" data-material="${v.id}" data-selected="${v.id===material}"><div class="option-header"><span>${v.number} / 04</span>${v.badge?`<span class="badge">${v.badge}</span>`:''}</div><div class="sample-stage"><div class="sample-background" aria-hidden="true"><span class="sample-folder">${icons.folder}</span><span class="sample-folder">${icons.folder}</span><span class="sample-folder">${icons.folder}</span></div><div class="menu-panel sample-menu" data-material="${v.id}"><div class="menu-list">${rootRows(false)}</div></div></div><div class="option-body"><div class="option-title"><h3>${v.name}</h3><em>${v.en}</em></div><p class="option-desc">${v.description}</p><label class="choose"><input type="radio" name="material" value="${v.id}" aria-label="使用${v.name}" ${v.id===material?'checked':''}>应用到上方预览</label></div></article>`).join('');
function setMaterial(id){const selected=materials.find(v=>v.id===id);if(!selected)return;material=id;level='root';isOpen=true;document.getElementById('currentTitle').textContent=`${selected.number} · ${selected.name}`;document.getElementById('selectionLabel').textContent=`${selected.number} · ${selected.name}`;document.querySelectorAll('.option').forEach(el=>el.dataset.selected=String(el.dataset.material===id));document.querySelectorAll('input[name=material]').forEach(el=>el.checked=el.value===id);renderMenu()}
function closeMenu(){isOpen=false;renderMenu();trigger.focus({preventScroll:true})}
trigger.addEventListener('click',()=>{isOpen=!isOpen;level='root';renderMenu()});
trigger.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();isOpen=true;level='root';renderMenu(true)}});
document.getElementById('options').addEventListener('change',e=>{if(e.target.name==='material')setMaterial(e.target.value)});
menu.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;const d=button.dataset;let focusKey='';if(d.level){level=d.level;renderMenu(true);return}if('back'in d){level='root';renderMenu(true);return}if(d.status){statuses.has(d.status)?statuses.delete(d.status):statuses.add(d.status);focusKey=`[data-status="${d.status}"]`}if(d.tag){tags.has(d.tag)?tags.delete(d.tag):tags.add(d.tag);focusKey=`[data-tag="${d.tag}"]`}if('date'in d){updated=d.date;focusKey=`[data-date="${d.date}"]`}if(d.match){match=d.match;focusKey=`[data-match="${d.match}"]`}renderMenu();if(focusKey)menu.querySelector(focusKey)?.focus({preventScroll:true})});
menu.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&level!=='root'){e.preventDefault();level='root';renderMenu(true);return}if(e.key==='ArrowRight'&&level==='root'&&document.activeElement?.dataset.level){e.preventDefault();document.activeElement.click();return}if(!['ArrowDown','ArrowUp','Home','End'].includes(e.key))return;const rows=[...menu.querySelectorAll('[role^="menuitem"]')];if(!rows.length)return;e.preventDefault();const index=rows.indexOf(document.activeElement),next=e.key==='Home'?0:e.key==='End'?rows.length-1:(index+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length;rows[next].focus({preventScroll:true});rows[next].scrollIntoView({block:'nearest'})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&isOpen){e.preventDefault();if(level!=='root'){level='root';renderMenu(true)}else closeMenu()}});
document.addEventListener('pointerdown',e=>{if(isOpen&&!e.target.closest('#liveMenu')&&!e.target.closest('#filterTrigger')&&!e.target.closest('#options')&&!e.target.closest('#themeToggle')&&!e.target.closest('#clearFilters'))closeMenu()});
document.getElementById('clearFilters').addEventListener('click',()=>{statuses.clear();tags.clear();updated='';renderMenu();trigger.focus({preventScroll:true})});
document.getElementById('themeToggle').addEventListener('click',e=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';e.currentTarget.textContent=dark?'切换浅色':'切换深色';e.currentTarget.setAttribute('aria-pressed',String(dark))});
renderMenu();
</script>
</body>
</html>
