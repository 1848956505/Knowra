<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知境 笔记索引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 笔记索引原型（Linear 列表思路）。外壳、色值、阴影沿用 knowra-layered.html；内容区为新排版：
   页头 → 视图标签 + 筛选/显示 → 分组列表（或卡片） → 右侧预览面板 → 浮动批量操作条 */
:root{
  --chrome:#e1e4ea;
  --page:#fbfcfd;
  --ink:#17181b; --ink-2:#686d76; --ink-3:#8a8f99; --ink-4:#b4b9c6;
  --line:rgba(24,30,48,.075); --line-2:rgba(24,30,48,.12);
  --hover:rgba(24,30,48,.055); --press:rgba(24,30,48,.085);
  --sel:rgba(24,30,48,.065);
  --accent:#f26b1d;
  --accent-ink:#c4510c;
  --accent-soft:color-mix(in srgb,var(--accent) 9%,#fff);
  --accent-line:color-mix(in srgb,var(--accent) 24%,#fff);
  --danger:#b4232a;
  --hl:inset 0 1px 0 rgba(255,255,255,.85);
  --ring:0 0 0 1px rgba(24,30,48,.08);
  --sh-card:0 0 0 1px rgba(24,30,48,.07),0 1px 2px rgba(24,30,48,.04);
  --sh-card-h:0 0 0 1px rgba(24,30,48,.10),0 2px 4px rgba(24,30,48,.05),0 10px 24px -12px rgba(24,30,48,.18);
  --sh-page:0 0 0 1px rgba(24,30,48,.07),0 1px 2px rgba(24,30,48,.05),0 6px 18px -6px rgba(24,30,48,.10),0 22px 48px -18px rgba(24,30,48,.14);
  --sh-pop:0 0 0 1px rgba(24,30,48,.08),0 4px 10px rgba(24,30,48,.06),0 24px 64px -12px rgba(24,30,48,.28);
  --ui:"Inter","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--ink);font:400 13px/1.5 var(--ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"calt","kern";overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;transition:background .12s var(--ease),color .12s var(--ease),box-shadow .12s var(--ease)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)!important;border-radius:7px}
::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}
kbd{font:500 10.5px/1 var(--mono);padding:2px 5px;border-radius:4px;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 1px 0 var(--line-2);color:var(--ink-2)}

.app{height:100%;display:grid;grid-template-columns:56px auto minmax(0,1fr);grid-template-rows:46px minmax(0,1fr);
  background:
    radial-gradient(460px 320px at 6% 4%,rgba(255,255,255,.32),transparent 70%),
    radial-gradient(640px 560px at -4% 104%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 66%),
    var(--chrome)}

/* ===== 顶栏 ===== */
.top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;min-width:0}
.ib{width:28px;height:28px;border-radius:7px;display:inline-grid;place-items:center;color:var(--ink-3);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib:disabled{opacity:.4;cursor:default;background:none}
.ib[aria-pressed=true]{background:var(--press);color:var(--ink)}
.tabs{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none;padding:8px 4px;margin:-8px -4px -8px 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;height:30px;max-width:190px;padding:0 6px 0 10px;border-radius:8px;color:var(--ink-2);font-size:12.5px;font-weight:450;flex:none;cursor:pointer}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .i{width:14px;height:14px;color:var(--ink-3)}
.tab:hover{background:var(--hover)}
.tab[aria-selected=true]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 0 0 1px rgba(24,30,48,.08),0 1px 2px rgba(24,30,48,.06),0 3px 8px -3px rgba(24,30,48,.10)}
.tab[aria-selected=true] .i{color:var(--accent)}
.tab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--ink-3);opacity:0}
.tab:hover .x,.tab[aria-selected=true] .x{opacity:1}
.tab .x:hover{background:var(--press);color:var(--ink)}
.tab .x .i{width:11px;height:11px;color:inherit}
.top .grow{flex:1;min-width:8px}
.pill{font-size:11px;color:var(--ink-3);padding:2px 8px;border-radius:999px;box-shadow:0 0 0 1px var(--line-2);background:rgba(255,255,255,.4);white-space:nowrap}

/* ===== 图标栏 ===== */
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 10px}
.rail .rb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.rail .rb:hover{background:var(--hover);color:var(--ink)}
.rail .rb[aria-current=page]{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.86));color:var(--accent);box-shadow:0 0 0 1px rgba(24,30,48,.08),0 1px 2px rgba(24,30,48,.06),0 6px 12px -6px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 1px 0 #fff}
.rail .rb .i{width:18px;height:18px}
.rail .mid{flex:1}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000));color:#fff;font:600 11px/26px var(--ui);text-align:center;margin-top:4px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}

/* ===== 上下文侧栏 ===== */
.ctx{width:240px;margin:0 8px 8px 0;border-radius:12px;background:rgba(247,249,250,.92);
  backdrop-filter:blur(28px) saturate(125%);-webkit-backdrop-filter:blur(28px) saturate(125%);
  border:1px solid rgba(54,60,74,.13);
  box-shadow:inset 1px 1px 0 #ffffffc7,0 1px 2px rgba(24,30,48,.05),0 12px 28px -16px rgba(24,30,48,.16);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.ctx{background:#f7f9fa}}
.ctx-h{display:flex;align-items:center;gap:6px;height:48px;padding:0 8px 0 14px}
.ctx-h strong{font-size:14px;font-weight:600;letter-spacing:-.01em}
.ctx-scroll{flex:1;min-height:0;overflow:auto;padding:0 8px 8px;scrollbar-width:thin;scrollbar-color:rgba(24,30,48,.15) transparent}
.nv{width:100%;height:30px;display:flex;align-items:center;gap:9px;padding:0 8px;border-radius:7px;color:var(--ink-2);text-align:left;font-weight:450;border:1px solid transparent}
.nv .i{color:var(--ink-3);width:15px;height:15px}
.nv:hover{background:var(--hover);color:var(--ink)}
.nv[aria-current=page]{background:linear-gradient(#ffffffb0,#ffffff65);border-color:#dfe2e9;box-shadow:0 1px 2px #21273506,inset 0 1px #fff;color:#283344;font-weight:600}
.nv[aria-current=page] .i{color:var(--accent)}
.nv .n{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:450}
.lbl{display:flex;align-items:center;gap:4px;margin:14px 4px 6px;padding:14px 4px 0;border-top:1px solid var(--line);font-size:11px;font-weight:500;color:var(--ink-3)}
.lbl.first{margin-top:2px;padding-top:0;border-top:0}
.lbl .ib{width:20px;height:20px;margin-left:auto}
.lbl .ib .i{width:12px;height:12px}
/* 文件夹树：缩进线不属于"左侧竖线强调" */
.tree{margin:0}
.tn{display:flex;align-items:center;gap:6px;width:100%;height:28px;padding:0 6px 0 calc(4px + var(--d,0) * 14px);border-radius:6px;font-size:12.5px;color:var(--ink-2);text-align:left}
.tn:hover{background:var(--hover);color:var(--ink)}
.tn[aria-current=page]{background:rgba(24,30,48,.075);color:var(--ink);font-weight:550}
.tn .tw{width:16px;height:16px;display:grid;place-items:center;border-radius:4px;color:var(--ink-4)}
.tn .tw:hover{color:var(--ink-2);background:var(--press)}
.tn .tw .i{width:11px;height:11px;transition:transform .15s var(--ease)}
.tn[aria-expanded=false] .tw .i{transform:rotate(-90deg)}
.tn .tw.leaf{visibility:hidden}
.tn > .i{width:14px;height:14px;color:var(--ink-3)}
.tn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn .n{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tn.drop{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.tg{display:flex;align-items:center;gap:8px;width:100%;height:28px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--ink-2);text-align:left}
.tg:hover{background:var(--hover);color:var(--ink)}
.tg[aria-pressed=true]{background:rgba(24,30,48,.075);color:var(--ink);font-weight:550}
.tg .n{margin-left:auto;font-size:11px;color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 16%,transparent)}
.ctx-f{padding:6px 8px 8px;border-top:1px solid var(--line)}
.local{display:flex;align-items:center;gap:6px;padding:6px 8px 0;font-size:11px;color:var(--ink-3)}
.local i{width:6px;height:6px;border-radius:50%;background:#2fb26b;box-shadow:0 0 0 3px rgba(47,178,107,.16)}

/* ===== 功能页面 ===== */
.page{margin:0 8px 8px 0;border-radius:12px;background:var(--page);box-shadow:var(--sh-page);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto minmax(0,1fr) 30px;min-width:0;overflow:hidden;position:relative}
.page > .full{grid-column:1/-1}

/* 页头 */
.ph{display:flex;align-items:center;gap:12px;padding:16px 20px 12px 24px;min-width:0}
.ph-l{min-width:0;flex:1}
.crumb{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--ink-3);margin:0 0 4px -6px;min-width:0;overflow:hidden;white-space:nowrap}
.crumb button{padding:1px 6px;border-radius:5px;color:var(--ink-3)}
.crumb button:hover{background:var(--hover);color:var(--ink)}
.crumb .s{color:var(--ink-4)}
.ph h1{margin:0;display:flex;align-items:baseline;gap:10px;font:650 21px/1.3 var(--ui);letter-spacing:-.4px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph h1 small{font:450 12px var(--ui);letter-spacing:0;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ph-r{display:flex;align-items:center;gap:6px;flex:none}

.sf{display:flex;align-items:center;gap:8px;width:240px;height:30px;padding:0 8px 0 10px;border-radius:8px;background:rgba(24,30,48,.035);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s var(--ease),background .12s var(--ease),width .2s var(--ease)}
.sf:hover{background:rgba(24,30,48,.05)}
.sf:focus-within{background:#fff;box-shadow:0 0 0 1px var(--line-2),0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);width:280px}
.sf .i{width:14px;height:14px;color:var(--ink-3)}
.sf input{all:unset;flex:1;min-width:0;font-size:12.5px;color:var(--ink)}
.sf input::placeholder{color:var(--ink-4)}
.sf .clr{width:18px;height:18px;border-radius:5px;display:none;place-items:center;color:var(--ink-3)}
.sf .clr:hover{background:var(--press);color:var(--ink)}
.sf .clr .i{width:11px;height:11px}
.sf.has .clr{display:grid}.sf.has kbd{display:none}

.bt{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;flex:none}
.bt .i{width:14px;height:14px;color:var(--ink-3)}
.bt:hover{background:var(--hover);color:var(--ink)}
.bt.out{background:rgba(255,255,255,.7);box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(24,30,48,.04)}
.bt.out:hover{background:#fff}
.bt[aria-expanded=true]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(24,30,48,.06)}
.bt .badge{min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600}
.split{display:inline-flex;border-radius:8px;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 80%,#000),0 1px 2px rgba(24,30,48,.2),inset 0 1px 0 rgba(255,255,255,.22);background:var(--accent);flex:none}
.split button{height:28px;color:#fff;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.split button:hover{background:rgba(255,255,255,.1)}
.split .main{padding:0 10px 0 9px;border-radius:8px 0 0 8px}
.split .more{width:24px;justify-content:center;border-radius:0 8px 8px 0;border-left:1px solid rgba(0,0,0,.14)}
.split .i{width:14px;height:14px;color:#fff}

/* 视图标签 + 工具 */
.fbar{display:flex;align-items:center;gap:6px;padding:0 20px 10px 22px;border-bottom:1px solid var(--line);min-width:0}
.vtabs{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;padding:4px;margin:-4px}
.vtabs::-webkit-scrollbar{display:none}
.vt{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:450;color:var(--ink-2);white-space:nowrap;flex:none}
.vt:hover{background:var(--hover);color:var(--ink)}
.vt .c{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vt[aria-selected=true]{background:#fff;color:var(--ink);font-weight:550;box-shadow:0 0 0 1px rgba(24,30,48,.08),0 1px 2px rgba(24,30,48,.06),0 3px 8px -3px rgba(24,30,48,.10)}
.vt[aria-selected=true] .i{color:var(--accent)}
.vt .i{width:14px;height:14px;color:var(--ink-3)}
.fbar .grow{flex:1;min-width:8px}
.vsep{width:1px;height:16px;background:var(--line-2);margin:0 4px;flex:none}

/* 已生效的筛选条件：Linear 式分段胶囊 */
.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 20px 8px 24px;border-bottom:1px solid var(--line);background:rgba(24,30,48,.012)}
.chips[hidden]{display:none}
.chip{display:inline-flex;align-items:stretch;height:24px;border-radius:7px;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(24,30,48,.04);font-size:12px;overflow:hidden}
.chip > *{display:inline-flex;align-items:center;gap:5px;padding:0 8px;color:var(--ink-2);white-space:nowrap}
.chip > * + *{border-left:1px solid var(--line)}
.chip .k{color:var(--ink-3)}
.chip .k .i{width:12px;height:12px}
.chip button:hover{background:var(--hover);color:var(--ink)}
.chip .v{color:var(--ink);font-weight:500}
.chip .x{padding:0 6px;color:var(--ink-3)}
.chip .x .i{width:11px;height:11px}
.chips .clear{font-size:12px;color:var(--ink-3);padding:0 6px;height:24px;border-radius:6px}
.chips .clear:hover{color:var(--ink);background:var(--hover)}
.chips .save{margin-left:auto}

/* 内容滚动区 */
.scroll:focus-visible{box-shadow:none!important}
.scroll{grid-column:1;grid-row:4;overflow:auto;min-height:0;min-width:0;scrollbar-width:thin;scrollbar-color:rgba(24,30,48,.14) transparent;position:relative;outline:0}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}

/* 子文件夹条 */
.fstrip{padding:16px 20px 6px 24px}
.sec-t{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink-3);margin:0 0 10px}
.sec-t button{margin-left:auto;font-size:11.5px;color:var(--ink-3);padding:1px 6px;border-radius:5px}
.sec-t button:hover{color:var(--ink);background:var(--hover)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:8px}
.fc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#fff;box-shadow:var(--sh-card);text-align:left;min-width:0}
.fc:hover{box-shadow:var(--sh-card-h)}
.fc .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(24,30,48,.045);color:var(--ink-2);flex:none}
.fc:hover .ico{color:var(--accent);background:var(--accent-soft)}
.fc .ico .i{width:15px;height:15px}
.fc b{display:block;font-size:13px;font-weight:550;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc small{display:block;font-size:11.5px;color:var(--ink-3)}
.fc .tx{min-width:0}
.fc.drop{box-shadow:0 0 0 1.5px var(--accent),0 6px 16px -8px color-mix(in srgb,var(--accent) 50%,transparent)}

/* 分组列表 */
.grp{position:relative}
.gh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:34px;padding:0 20px 0 18px;background:color-mix(in srgb,var(--page) 88%,#eef0f4);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.gh .tw{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--ink-3)}
.gh .tw:hover{background:var(--press);color:var(--ink)}
.gh .tw .i{width:12px;height:12px;transition:transform .15s var(--ease)}
.grp.closed .gh .tw .i{transform:rotate(-90deg)}
.grp.closed .rows{display:none}
.gh b{font-weight:550;color:var(--ink)}
.gh .c{color:var(--ink-3);font-variant-numeric:tabular-nums}
.gh .add{margin-left:auto;opacity:0}
.gh:hover .add{opacity:1}

.row{display:grid;grid-template-columns:22px 18px minmax(0,1fr) auto var(--col-folder,128px) var(--col-date,68px) 28px;align-items:center;gap:10px;height:42px;padding:0 14px 0 16px;border-bottom:1px solid rgba(24,30,48,.045);cursor:default;position:relative;user-select:none}
.row:hover{background:rgba(24,30,48,.03)}
.row.cur{background:rgba(24,30,48,.045)}
.row.on{background:var(--sel)}
.row.on.cur{background:rgba(24,30,48,.085)}
.row.drag{opacity:.45}
.cb{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(24,30,48,.22);background:#fff;opacity:0;transition:opacity .1s,background .1s}
.cb .i{width:11px;height:11px;stroke-width:2.4;color:#fff;opacity:0}
.row:hover .cb,.row.cur .cb,.selecting .cb{opacity:1}
.row.on .cb{opacity:1;background:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 80%,#000)}
.row.on .cb .i{opacity:1}
.row .ico{color:var(--ink-3);display:grid;place-items:center}
.row .ico .i{width:15px;height:15px}
.row .tl{display:flex;align-items:baseline;gap:10px;min-width:0}
.row .tl b{font-weight:500;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:70%}
.row .tl span{color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .tl .lk{width:12px;height:12px;color:var(--ink-3);align-self:center;flex:none}
svg.st{width:12px;height:12px;align-self:center;flex:none;fill:#f5b301;stroke:#e0a000}
.row .tags{display:flex;gap:4px;justify-content:flex-end;min-width:0}
.row .loc{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.row .loc .i{width:12px;height:12px;flex:none}
.row .dt{font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .mo{width:26px;height:26px;opacity:0}
.row:hover .mo,.row.cur .mo{opacity:1}
.row .acts{display:none;gap:4px}
.trash .row .acts{display:flex}
.trash .row .mo{display:none}
.row.folder .tl b{font-weight:550}
/* 列表行隐藏属性时保留网格占位（宽度归零），避免后续单元格错列 */
.hide-tags .row .tags,.hide-folder .row .loc,.hide-date .row .dt{visibility:hidden;width:0;min-width:0;overflow:hidden}
.hide-tags .card .tags,.hide-folder .card .loc,.hide-date .card .dt{display:none}
.hide-summary .row .tl span,.hide-summary .card p{display:none}
.hide-folder .row{--col-folder:0px}.hide-date .row{--col-date:0px}

.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px 0 6px;border-radius:999px;font-size:11px;color:var(--ink-2);background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 1px rgba(0,0,0,.02);white-space:nowrap}
.tag .dot{width:6px;height:6px;box-shadow:none}
.tag.more{padding:0 6px;color:var(--ink-3)}

/* 卡片视图 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:12px;padding:12px 20px 24px 24px}
.cgrp + .cgrp{border-top:0}
.cgrp .gh{position:static;background:none;border:0;padding:18px 20px 0 24px;height:auto}
.card{display:flex;flex-direction:column;gap:8px;min-height:156px;padding:14px 14px 12px;border-radius:12px;background:#fff;box-shadow:var(--sh-card);text-align:left;position:relative;cursor:default;user-select:none}
.card:hover{box-shadow:var(--sh-card-h)}
.card.cur{box-shadow:0 0 0 1px rgba(24,30,48,.16),0 2px 6px rgba(24,30,48,.06)}
.card.on{box-shadow:0 0 0 1.5px var(--accent),0 4px 14px -6px color-mix(in srgb,var(--accent) 40%,transparent)}
.card .cb{position:absolute;top:12px;right:12px}
.card:hover .cb,.card.on .cb,.selecting .card .cb{opacity:1}
.card.on .cb{background:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 80%,#000)}
.card.on .cb .i{opacity:1}
.card h3{margin:0;padding-right:24px;font:600 14px/1.45 var(--ui);letter-spacing:-.15px;color:var(--ink);display:flex;gap:6px;align-items:flex-start}
.card h3 .i{width:13px;height:13px;margin-top:3px;color:var(--ink-3)}
.card p{margin:0;font-size:12.5px;line-height:1.7;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.card .ft{display:flex;align-items:center;gap:6px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
.card .ft .i{width:12px;height:12px}
.card .ft .dt{margin-left:auto}

/* 空状态 */
.empty{display:grid;place-items:center;text-align:center;padding:72px 24px;color:var(--ink-3)}
.empty .art{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh-card);color:var(--ink-3);margin:0 auto 14px}
.empty b{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px}
.empty p{margin:0 0 14px;font-size:12.5px;line-height:1.7}
.notice{display:flex;align-items:center;gap:10px;margin:12px 20px 4px 24px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px var(--line);font-size:12.5px;color:var(--ink-2)}
.notice .i{color:var(--ink-3)}
.notice .bt{margin-left:auto}
.bt.danger{color:var(--danger)}
.bt.danger .i{color:var(--danger)}
.bt.danger:hover{background:color-mix(in srgb,var(--danger) 8%,#fff)}

/* 预览面板 */
.peek{width:360px;border-left:1px solid var(--line);grid-row:4;grid-column:2;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,rgba(24,30,48,.018),transparent 220px)}
.peek[hidden]{display:none}
.pk-h{display:flex;align-items:center;gap:4px;height:44px;padding:0 10px 0 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3);flex:none}
.pk-h span{flex:1}
.pk-b{flex:1;min-height:0;overflow:auto;padding:20px 20px 28px;scrollbar-width:thin}
.pk-b h2{margin:0 0 6px;font:700 20px/1.35 var(--ui);letter-spacing:-.4px;color:var(--ink);text-wrap:balance}
.pk-b .sum{margin:0 0 18px;font-size:13px;line-height:1.75;color:var(--ink-2)}
.props{display:grid;grid-template-columns:72px minmax(0,1fr);gap:2px 8px;margin:0 0 18px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.props dt{font-size:12px;color:var(--ink-3);height:28px;display:flex;align-items:center}
.props dd{margin:0;min-height:28px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:12.5px;color:var(--ink-2)}
.props dd button{display:inline-flex;align-items:center;gap:6px;height:26px;margin-left:-8px;padding:0 8px;border-radius:6px;color:var(--ink-2)}
.props dd button:hover{background:var(--hover);color:var(--ink)}
.props dd .i{width:13px;height:13px;color:var(--ink-3)}
.pk-b h4{margin:0 0 8px;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.ol{margin:0 0 20px;padding:0;list-style:none}
.ol li{font-size:12.5px;color:var(--ink-2);padding:5px 0 5px 12px;position:relative}
.ol li::before{content:'';position:absolute;left:0;top:13px;width:4px;height:4px;border-radius:50%;background:var(--ink-4)}
.ol li.sub{padding-left:26px}.ol li.sub::before{left:14px}
.excerpt{font-size:13px;line-height:1.8;color:var(--ink-2);padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px var(--line)}
.pk-f{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);flex:none}
.pk-f .btn{flex:1;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;font-weight:500;font-size:12.5px;background:var(--accent);color:#fff;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 80%,#000),0 1px 2px rgba(24,30,48,.2),inset 0 1px 0 rgba(255,255,255,.22)}
.btn:hover{filter:brightness(1.06)}
.btn .i{width:14px;height:14px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(24,30,48,.05)}
.btn.ghost:hover{filter:none;background:#f6f7f9}
.btn.red{background:var(--danger);box-shadow:0 0 0 1px color-mix(in srgb,var(--danger) 80%,#000),0 1px 2px rgba(24,30,48,.2),inset 0 1px 0 rgba(255,255,255,.18)}

/* 页脚 */
.foot{grid-column:1/-1;grid-row:5;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);background:rgba(24,30,48,.014);white-space:nowrap;overflow:hidden}
.foot .r{margin-left:auto;display:flex;gap:12px;align-items:center}
.foot kbd{font-size:9.5px;padding:1px 4px}

/* 浮动批量操作条 */
.bulk{position:absolute;left:50%;bottom:46px;transform:translate(-50%,12px);display:flex;align-items:center;gap:2px;padding:5px 5px 5px 8px;border-radius:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh-pop),var(--hl);opacity:0;pointer-events:none;transition:opacity .16s var(--ease),transform .16s var(--ease);z-index:6;white-space:nowrap}
.bulk.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.bulk .cnt{display:inline-flex;align-items:center;gap:8px;padding:0 10px 0 4px;margin-right:4px;border-right:1px solid var(--line-2);height:22px;font-size:12.5px;font-weight:550;color:var(--ink)}
.bulk .cnt .cb{opacity:1;background:var(--accent);box-shadow:none}
.bulk .cnt .cb .i{opacity:1}

/* 弹出菜单 / 显示设置 */
.pop{position:fixed;z-index:30;min-width:200px;max-width:300px;padding:4px;border-radius:10px;background:rgba(252,252,254,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--sh-pop);opacity:0;transform:translateY(-4px);transition:opacity .12s var(--ease),transform .12s var(--ease);pointer-events:none}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.pop .ms{display:flex;align-items:center;gap:8px;padding:6px 8px 8px;border-bottom:1px solid var(--line);margin:-4px -4px 4px}
.pop .ms input{all:unset;flex:1;font-size:12.5px;padding:4px 4px}
.pop .ms input::placeholder{color:var(--ink-4)}
.mh{padding:6px 8px 4px;font-size:11px;color:var(--ink-3);font-weight:500}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--ink);text-align:left}
.mi .i{width:14px;height:14px;color:var(--ink-3)}
.mi:hover,.mi.act{background:var(--hover)}
.mi .r{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--ink-3);font-size:11.5px}
.mi .ck{width:14px;height:14px;color:var(--accent);visibility:hidden}
.mi[aria-checked=true] .ck{visibility:visible}
.mi.danger{color:var(--danger)}.mi.danger .i{color:var(--danger)}
.mi:disabled{opacity:.45;cursor:default;background:none}
.msep{height:1px;background:var(--line);margin:4px 2px}
.disp{width:340px;max-width:calc(100vw - 16px);padding:12px}
.dr{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.dr > span:first-child{flex:1;font-size:12.5px;color:var(--ink-2)}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:rgba(24,30,48,.06)}
.seg button{white-space:nowrap;height:24px;padding:0 9px;border-radius:6px;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.seg button .i{width:13px;height:13px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(24,30,48,.08)}
.sel{height:26px;padding:0 8px;border-radius:7px;background:#fff;box-shadow:0 0 0 1px var(--line-2);font-size:12px;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.sel .i{width:11px;height:11px;color:var(--ink-3)}
.disp hr{border:0;border-top:1px solid var(--line);margin:12px -12px}
.disp h5{margin:0 0 8px;font-size:11px;font-weight:500;color:var(--ink-3)}
.ptgl{display:flex;flex-wrap:wrap;gap:6px}
.ptgl button{height:24px;padding:0 9px;border-radius:999px;font-size:12px;color:var(--ink-3);box-shadow:0 0 0 1px var(--line-2)}
.ptgl button[aria-pressed=true]{color:var(--ink);background:#fff;box-shadow:0 0 0 1px rgba(24,30,48,.16),0 1px 2px rgba(24,30,48,.05)}
.disp .reset{font-size:12px;color:var(--ink-3);padding:2px 6px;border-radius:5px;margin-left:-6px}
.disp .reset:hover{color:var(--ink);background:var(--hover)}

/* 弹窗 */
dialog.dlg{padding:0;border:0;border-radius:14px;width:min(420px,calc(100vw - 32px));background:rgba(252,252,254,.97);backdrop-filter:blur(28px);box-shadow:var(--sh-pop);color:var(--ink)}
dialog.dlg::backdrop{background:rgba(30,36,56,.22);backdrop-filter:blur(3px)}
.dh{padding:18px 20px 4px}
.dh h3{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.2px}
.dh p{margin:0;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.db{padding:12px 20px}
.db .fld{display:flex;align-items:center;height:34px;padding:0 10px;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--line-2)}
.db .fld:focus-within{box-shadow:0 0 0 1px var(--line-2),0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.db .fld input{all:unset;flex:1;font-size:13px}
.pick{max-height:260px;overflow:auto;margin:0 -8px;padding:0 4px}
.df{display:flex;justify-content:flex-end;gap:8px;padding:10px 20px 16px}
dialog.pal{padding:0;border:0;border-radius:14px;width:min(520px,calc(100vw - 32px));margin-top:16vh;background:rgba(252,252,254,.95);backdrop-filter:blur(28px);box-shadow:var(--sh-pop);color:var(--ink)}
dialog.pal::backdrop{background:rgba(30,36,56,.22);backdrop-filter:blur(3px)}
.keys{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:4px 20px 8px;font-size:12.5px;color:var(--ink-2)}
.keys span:nth-child(even){display:flex;gap:4px;justify-content:flex-end}

.toast{position:fixed;bottom:48px;left:50%;transform:translate(-50%,8px);display:flex;align-items:center;gap:12px;background:#262b3a;color:#fff;padding:8px 10px 8px 14px;border-radius:9px;font-size:12px;box-shadow:var(--sh-pop);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:40;white-space:nowrap;max-width:calc(100vw - 24px)}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#ffb98c;font-weight:500;padding:2px 6px;border-radius:5px}
.toast button:hover{background:rgba(255,255,255,.1)}
.toast:not(.act){padding-right:14px}.toast:not(.act) button{display:none}

@media (max-width:1180px){.row{--col-folder:104px}.peek{width:320px}}
@media (max-width:1040px){
  .page:has(.peek:not([hidden])) .row .tags{visibility:hidden;width:0;overflow:hidden}
  .sf{width:180px}.sf:focus-within{width:220px}
}
@media (max-width:900px){
  .app{grid-template-columns:56px minmax(0,1fr)}
  .ctx{position:fixed;left:56px;top:46px;bottom:0;z-index:12;margin:0 0 8px;box-shadow:var(--sh-pop);background:rgba(246,247,250,.97)}
  .app.sb-off .ctx{display:none}
  .page{grid-column:2}
  .peek{position:absolute;right:0;top:0;bottom:30px;z-index:5;background:#fbfbfd;box-shadow:-10px 0 24px -10px rgba(24,30,48,.14)}
  .row{grid-template-columns:22px 18px minmax(0,1fr) auto 28px}.row .loc,.row .tags{display:none}
  .pill,.foot .r{display:none}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .ctx{left:0}
  .page{grid-column:1;margin:0 6px 6px}
  .ph{flex-wrap:wrap;padding:14px 16px 10px}
  .ph-r{width:100%}.sf,.sf:focus-within{flex:1 1 0;width:auto;min-width:0}
  .ph-r .bt span{display:none}
  .fbar,.chips{padding-left:16px;padding-right:16px}
  .fbar .bt span{display:none}
  .row{padding:0 10px 0 12px;gap:8px;grid-template-columns:18px 16px minmax(0,1fr) auto 26px}
  .split .main span{display:none}.split .main{padding:0 8px}
  .row .tl span{display:none}.row .tl b{max-width:100%}
  .fstrip,.cards{padding-left:16px;padding-right:16px}
  .peek{width:100%}
  .bulk{max-width:calc(100% - 16px);overflow-x:auto}
}
@media (min-width:901px){.ctx{grid-column:2;grid-row:2}.page{grid-column:3;grid-row:2}.app.sb-off{grid-template-columns:56px 0 minmax(0,1fr)}.app.sb-off .ctx{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ===== 工具函数 ===== */
var fById=function(id){return folders.find(function(f){return f.id===id})};
var nById=function(id){return notes.find(function(n){return n.id===id})};
var tById=function(id){return tags.find(function(t){return t.id===id})};
function kids(pid){return folders.filter(function(f){return f.parent===pid}).sort(function(a,b){return a.name.localeCompare(b.name,'zh-CN')})}
function desc(id){var r=[id];kids(id).forEach(function(k){r=r.concat(desc(k.id))});return r}
function path(id){var p=[],f=fById(id);while(f){p.unshift(f);f=fById(f.parent)}return p}
function live(){return notes.filter(function(n){return !n.del})}
function countIn(id){var ds=desc(id);return live().filter(function(n){return ds.indexOf(n.folder)>-1}).length}
function dayDiff(iso){var a=new Date(iso),b=new Date(NOW);a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.round((b-a)/864e5)}
function fmt(iso){var dd=dayDiff(iso),t=new Date(iso);if(dd===0)return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');if(dd===1)return '昨天';if(dd<7)return dd+' 天前';return (t.getMonth()+1)+'月'+t.getDate()+'日'}
function fmtLong(iso){var t=new Date(iso);return t.getFullYear()+'年'+(t.getMonth()+1)+'月'+t.getDate()+'日 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')}

/* ===== 计算可见内容 ===== */
var TIME={today:['今天',0],d7:['过去 7 天',6],d30:['过去 30 天',29]};
function scopeNotes(){
  if(S.scope==='trash')return notes.filter(function(n){return n.del});
  var L=live();
  if(S.scope==='inbox')return L.filter(function(n){return !n.folder});
  if(S.scope==='all'||S.scope==='recent'||S.scope==='fav')return L;
  var ds=desc(S.scope);return L.filter(function(n){return ds.indexOf(n.folder)>-1});
}
function matchQ(n,q){return (n.title+' '+n.sum+' '+n.tags.map(function(id){return tById(id).name}).join(' ')+' '+locName(n)).toLowerCase().indexOf(q)>-1}
function visibleNotes(ignoreTab){
  var q=S.q.trim().toLowerCase(),f=S.f;
  var r=scopeNotes().filter(function(n){
    if(!ignoreTab&&S.tab==='fav'&&!n.fav)return false;
    if(S.scope==='fav'&&!n.fav)return false;
    if(S.scope==='recent'&&dayDiff(n.upd)>6)return false;
    if(q&&!matchQ(n,q))return false;
    if(f.tags.length){var hit=f.tags.filter(function(t){return n.tags.indexOf(t)>-1}).length;if(f.tagMode==='any'?hit===0:hit<f.tags.length)return false}
    if(f.time&&dayDiff(n.upd)>TIME[f.time][1])return false;
    if(f.priv&&(f.priv==='private')!==n.priv)return false;
    return true;
  });
  var key=S.scope==='trash'?'del':'upd';
  r.sort(function(a,b){if(S.sort==='name-asc')return a.title.localeCompare(b.title,'zh-CN');var x=Date.parse(a[key]||a.upd),y=Date.parse(b[key]||b.upd);return S.sort==='updated-asc'?x-y:y-x});

}

}
function filtersOn(){var f=S.f;return f.tags.length||f.time||f.priv}
function groupsOf(list){

  var m={},order=[];
  list.forEach(function(n){var k,l;
    if(S.group==='date'){var dd=dayDiff(n.upd);k=dd===0?'a':dd===1?'b':dd<7?'c':dd<31?'d':'e';l={a:'今天',b:'昨天',c:'过去 7 天',d:'本月更早',e:'更早'}[k]}
    else{var top=n.folder?path(n.folder)[0]:null;
      if(fById(S.scope)){var p=n.folder?path(n.folder):[];var i=p.findIndex(function(x){return x.id===S.scope});top=p[i+1]||fById(S.scope)}

    if(!m[k]){m[k]={key:k,label:l,items:[]};order.push(k)}m[k].items.push(n)});
  if(S.group==='date')order.sort();

}

function go(scope,opts){
  opts=opts||{};
  if(!opts.hist&&(hpos<0||hist[hpos]!==scope)){hist=hist.slice(0,hpos+1);hist.push(scope);hpos=hist.length-1}
  if(scope!==S.scope){S.sel.clear();S.cur=null;S.anchor=null}
  S.scope=scope;if(!opts.keepTab)S.tab='all';
  if(fById(scope))path(scope).forEach(function(f){S.expanded.add(f.id)});
  $('#back').disabled=hpos<=0;$('#fwd').disabled=hpos>=hist.length-1;
  render();renderTabs();$('#scroll').scrollTop=0;narrowClose();
}
function narrowClose(){if(matchMedia('(max-width:900px)').matches)setSb(false)}

function newNote(fid){
  if(fid===undefined)fid=fById(S.scope)?S.scope:null;
  var n={id:'n'+Date.now(),title:'无标题笔记',folder:fid,tags:[],fav:false,upd:new Date(NOW.getTime()+6e4).toISOString(),crt:new Date(NOW).toISOString(),words:0,priv:false,sum:'',ol:[]};

var menuKeep=false,menuAnchor=null;
function openMenu(anchor,items,opts){
  opts=opts||{};var m=$('#menu');closeDisp();
  m.innerHTML=(opts.search?'<div class="ms">'+ic('search')+'<input placeholder="'+opts.search+'" aria-label="筛选选项"></div>':'')+'<div class="mlist">'+items.map(mItem).join('')+'</div>';
  m._items=items;m._opts=opts;
  place(m,anchor);m.classList.add('show');
  if(menuAnchor&&menuAnchor.setAttribute)menuAnchor.setAttribute('aria-expanded','false');
  menuAnchor=anchor.nodeType?anchor:null;if(menuAnchor)menuAnchor.setAttribute('aria-expanded','true');
  var inp=$('.ms input',m);if(inp){inp.focus();inp.oninput=function(){var q=inp.value.trim().toLowerCase();$('.mlist',m).innerHTML=items.filter(function(it){return !it.label||it.sep||it.head||it.label.toLowerCase().indexOf(q)>-1}).map(mItem).join('')}}
  else{var f=$('.mi:not(:disabled)',m);f&&f.focus()}
}
function mItem(it,i){
  var idx=(it._i=it._i==null?Math.random().toString(36).slice(2):it._i);
  if(it.sep)return '<div class="msep"></div>';
  if(it.head)return '<div class="mh">'+esc(it.head)+'</div>';
  return '<button class="mi'+(it.danger?' danger':'')+'" role="'+(it.checked!=null?'menuitemcheckbox':'menuitem')+'" data-mi="'+idx+'"'+(it.checked!=null?' aria-checked="'+!!it.checked+'"':'')+(it.disabled?' disabled':'')+'>'+(it.checked!=null?ic('check','ck'):'')+(it.dot?'<i class="dot" style="--c:'+it.dot+'"></i>':it.icon?ic(it.icon):'')+'<span>'+esc(it.label)+'</span>'+(it.hint||it.kbd||it.sub?'<span class="r">'+(it.hint?esc(it.hint):'')+(it.kbd?'<kbd>'+it.kbd+'</kbd>':'')+(it.sub?ic('chev-r'):'')+'</span>':'')+'</button>';
}
function place(el,anchor){
  el.style.left='0px';el.style.top='0px';el.classList.add('show');var w=el.offsetWidth,h=el.offsetHeight;el.classList.remove('show');
  var x,y;if(anchor.nodeType){var r=anchor.getBoundingClientRect();x=r.right-w>8&&anchor.closest('.ph-r,.fbar,.pk-h,.row,.gh,.card')&&!anchor.closest('.vtabs')?r.right-w:r.left;y=r.bottom+6;if(y+h>innerHeight-8)y=r.top-h-6}
  else{x=anchor.x;y=anchor.y;if(y+h>innerHeight-8)y=Math.max(8,y-h)}
  x=Math.max(8,Math.min(x,innerWidth-w-8));el.style.left=x+'px';el.style.top=Math.max(8,y)+'px';
}

    if(e.metaKey||e.ctrlKey){toggleSel(id);setCur(id);return}
    if(S.sel.size){toggleSel(id);setCur(id);return}
    setCur(id);S.anchor=id;if(!S.peek&&matchMedia('(min-width:1101px)').matches){}return;
  }
});
document.addEventListener('dblclick',function(e){var r=e.target.closest('#scroll [data-id]');if(r&&!e.target.closest('button'))openNote(r.dataset.id)});
document.addEventListener('contextmenu',function(e){
  var r=e.target.closest('#scroll [data-id]');if(r){e.preventDefault();if(!S.sel.has(r.dataset.id)&&S.sel.size){S.sel.clear();refreshSel()}setCur(r.dataset.id);noteMenu(r.dataset.id,{x:e.clientX,y:e.clientY});return}
  var f=e.target.closest('[data-folder],[data-dropf]');if(f){e.preventDefault();folderMenu(f.dataset.folder||f.dataset.dropf,{x:e.clientX,y:e.clientY})}
});
$('#filterbtn').onclick=function(){if($('#menu').classList.contains('show')&&menuAnchor===this){closeMenu();return}filterMenu(this)};
$('#dispbtn').onclick=function(){if($('#disp').classList.contains('show'))closeDisp();else openDisp()};
$('#newmore').onclick=function(){openMenu(this,[{label:'新建笔记',icon:'edit',kbd:'C',run:function(){newNote()}},{label:'新建文件夹',icon:'folder-plus',run:function(){folderDlg(fById(S.scope)?S.scope:null)}},{sep:1},{label:'导入 Markdown…',icon:'upload',run:importMd}])};
function importMd(){showDlg('<div class="dh"><h3>导入 Markdown</h3><p>选择 .md 文件或整个文件夹，导入到「'+esc(fById(S.scope)?fById(S.scope).name:'未整理')+'」。文件夹结构会被保留，同名笔记自动重命名。</p></div><div class="db"><div class="empty" style="padding:28px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-2);background:#fff"><div><div class="art">'+ic('upload')+'</div><b>拖放文件到这里</b><p style="margin:0">原型不会读取文件</p></div></div></div><div class="df"><button class="btn ghost" data-close-dlg>取消</button><button class="btn" data-close-dlg>选择文件</button></div>')}
$('#import').onclick=importMd;
$('#q').addEventListener('input',function(){S.q=this.value;$('#sf').classList.toggle('has',!!this.value);render()});
$('#qclr').onclick=function(e){e.preventDefault();S.q='';$('#q').value='';$('#sf').classList.remove('has');render();$('#q').focus()};
$('#sbtoggle').onclick=function(){setSb($('#app').classList.contains('sb-off'))};
$('#itog').onclick=function(){S.peek=!S.peek;if(S.peek&&!S.cur&&flat[0])S.cur=flat[0];markCur();renderPeek()};
$('#keysbtn').onclick=function(){$('#keys').showModal()};
$('#back').onclick=function(){if(hpos>0){hpos--;go(hist[hpos],{hist:1})}};
$('#fwd').onclick=function(){if(hpos<hist.length-1){hpos++;go(hist[hpos],{hist:1})}};

/* 拖放：把笔记拖到侧栏文件夹或子文件夹卡片上 */
var dragIds=null;
document.addEventListener('dragstart',function(e){var r=e.target.closest&&e.target.closest('#scroll [data-id]');if(!r)return;dragIds=targets(r.dataset.id);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragIds.join(','));dragIds.forEach(function(id){var el=$('#scroll [data-id="'+id+'"]');el&&el.classList.add('drag')})});
document.addEventListener('dragend',function(){dragIds=null;$$('.drag,.drop').forEach(function(x){x.classList.remove('drag','drop')})});
document.addEventListener('dragover',function(e){var t=dragIds&&e.target.closest('[data-dropf],.fc[data-folder],.nv[data-scope="inbox"]');$$('.drop').forEach(function(x){if(x!==t)x.classList.remove('drop')});if(t){e.preventDefault();t.classList.add('drop')}});
document.addEventListener('drop',function(e){var t=dragIds&&e.target.closest('[data-dropf],.fc[data-folder],.nv[data-scope="inbox"]');if(!t)return;e.preventDefault();var fid=t.dataset.dropf||t.dataset.folder||null;moveTo(dragIds,fid)});

/* 键盘 */
document.addEventListener('keydown',function(e){
  var typing=e.target.matches&&e.target.matches('input,textarea,[contenteditable=true]');
  if(document.querySelector('dialog[open]'))return;
  if($('#menu').classList.contains('show')||$('#disp').classList.contains('show')){if(e.key==='Escape'){var a=menuAnchor;closeMenu();closeDisp();a&&a.focus()}return}
  if(typing){if(e.key==='Escape'){e.target.blur();if(S.q){S.q='';e.target.value='';$('#sf').classList.remove('has');render()}}if(e.key==='ArrowDown'&&e.target.id==='q'&&flat[0]){e.preventDefault();e.target.blur();setCur(flat[0],true)}return}
  var k=e.key,i=flat.indexOf(S.cur);
  if((e.metaKey||e.ctrlKey)&&k.toLowerCase()==='k'){e.preventDefault();$('#q').focus();return}
  if((e.metaKey||e.ctrlKey)&&k.toLowerCase()==='a'){e.preventDefault();flat.forEach(function(id){S.sel.add(id)});refreshSel();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(k==='j'||k==='ArrowDown'||k==='k'||k==='ArrowUp'){e.preventDefault();if(!flat.length)return;var dn=k==='j'||k==='ArrowDown';var ni=i<0?0:Math.max(0,Math.min(flat.length-1,i+(dn?1:-1)));if(e.shiftKey){if(!S.anchor)S.anchor=flat[i<0?0:i];S.sel.add(flat[i<0?0:i]);S.sel.add(flat[ni]);refreshSel()}setCur(flat[ni],true);return}
  if(k==='/'){e.preventDefault();$('#q').focus();return}
  if(k==='?'){$('#keys').showModal();return}
  if(k==='f'){e.preventDefault();filterMenu($('#filterbtn'));return}
  if(k==='c'&&S.scope!=='trash'){e.preventDefault();newNote();return}
  if(k==='Escape'){if(S.sel.size){S.sel.clear();refreshSel()}else if(S.peek){S.peek=false;renderPeek()}return}
  if(!S.cur&&!S.sel.size)return;
  var ids=targets();
  if(k==='x'){e.preventDefault();if(S.cur)toggleSel(S.cur);return}
  if(k===' '){e.preventDefault();S.peek=!S.peek;renderPeek();return}
  if(k==='Enter'&&S.cur){openNote(S.cur);return}
  if(S.scope==='trash')return;
  if(k==='s'){toggleFav(ids);return}
  if(k==='m'){e.preventDefault();moveDlg(ids);return}
  if(k==='l'){e.preventDefault();tagDlg(ids);return}
  if(k==='r'&&S.cur&&!S.sel.size){e.preventDefault();renameDlg(S.cur);return}
  if(k==='Backspace'||k==='Delete'){e.preventDefault();trashNotes(ids)}
});
addEventListener('resize',function(){closeMenu();closeDisp()});
$('#scroll').addEventListener('scroll',function(){closeMenu()});

if(matchMedia('(max-width:900px)').matches)setSb(false);
go('all');S.cur='n1';S.peek=matchMedia('(min-width:1280px)').matches;render();
</script>
</body>
</html>
