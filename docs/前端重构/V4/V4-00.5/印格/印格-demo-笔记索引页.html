<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F9F7F2">
  <title>知境 · 印格笔记索引页 Demo</title>
  <style>
    :root {
      --ink-bg: #f9f7f2;
      --ink-surface: #ffffff;
      --ink-sunken: #f4f1ea;
      --ink: #1a1a1a;
      --ink-secondary: #66635e;
      --ink-muted: #aaa8a2;
      --ink-panel: #e5e2dc;
      --ink-soft: #f0eee9;
      --ink-dot: #d3c9ba;
      --ink-accent: #2563eb;
      --ink-accent-hover: #1d4ed8;
      --ink-accent-soft: #e0f2fe;
      --ink-success: #16a34a;
      --ink-warning: #ea580c;
      --ink-danger: #dc2626;
      /* 外壳线：2px 墨黑保留给浮层/按钮等特色元素的描边 */
      --shell-line: 2px solid var(--ink);
      /* 外壳分区线：减薄为 1px、颜色柔化为暖墨灰，用于模块轨道/状态栏等窗口主分区 */
      --ink-shell: #a8a29a;
      --shell-line-soft: 1px solid var(--ink-shell);
      --panel-line: 1px solid var(--ink-panel);
      --soft-line: 1px solid var(--ink-soft);
      /* 硬阴影：保留实心位移骨架，仅加 1px 模糊并柔化为暖灰，降低锐利感 */
      --shadow-1: 2px 2px 1px #6b6b6b;
      --shadow-2: 3px 3px 1px #6b6b6b;
      --shadow-focus: 3px 3px 0 var(--ink-accent);
      --rail-size: 64px;
      --sidebar-size: 224px;
      --status-size: 32px;
      --docbar-size: 52px;
      --motion-fast: 140ms;
      --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html,
    body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--ink-bg);
      color: var(--ink);
      font: 14px/1.5 var(--font-ui);
    }

    button,
    input { font: inherit; }

    button {
      color: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:not(:disabled) { cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    [contenteditable="true"]:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--ink-surface);
      outline-offset: 1px;
      box-shadow: var(--shadow-focus);
    }

    [hidden] { display: none !important; }

    .icon {
      width: 19px;
      height: 19px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: square;
      stroke-linejoin: miter;
      stroke-width: 1.8;
    }

    .skip-link {
      position: fixed;
      left: 12px;
      top: 10px;
      z-index: 1000;
      padding: 8px 12px;
      border: var(--shell-line);
      background: var(--ink-surface);
      color: var(--ink);
      font-weight: 800;
      box-shadow: var(--shadow-1);
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: translateY(0); }

    .app-shell {
      width: 100vw;
      height: 100dvh;
      display: grid;
      grid-template-columns: var(--rail-size) var(--sidebar-size) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) var(--status-size);
      background: var(--ink-surface);
    }

    .module-rail {
      grid-column: 1;
      grid-row: 1;
      z-index: 40;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px 0 12px;
      border-right: var(--shell-line-soft);
      background: var(--ink-bg);
      /* 沿右缘线向内容区投一层柔和阴影，形成面板浮起感 */
      box-shadow: 8px 0 16px rgba(26, 26, 26, .09);
      scrollbar-width: none;
    }

    .module-rail::-webkit-scrollbar { display: none; }

    .brand {
      width: 40px;
      height: 40px;
      position: relative;
      flex: 0 0 40px;
      margin: 0 auto 7px;
      border: 0;
      background: transparent;
    }

    .brand::before,
    .brand::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
    }

    .brand::before {
      right: 3px;
      bottom: 3px;
      background: var(--ink-accent);
    }

    .brand::after {
      left: 3px;
      top: 3px;
      border: var(--shell-line);
      background: var(--ink-surface);
    }

    .brand-glyph {
      position: absolute;
      inset: 4px auto auto 4px;
      z-index: 1;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
    }

    .rail-group { display: grid; gap: 1px; }
    .rail-group--utility { margin-top: auto; }

    .rail-item {
      width: 100%;
      min-height: 46px;
      display: grid;
      place-items: center;
      padding: 3px 0;
      border: 0;
      background: transparent;
    }

    .rail-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      transition: color var(--motion-fast), transform var(--motion-fast);
    }

    .rail-item:hover .rail-icon { color: var(--ink); }

    .rail-item:active .rail-icon { transform: translate(2px, 2px); }

    /* 选中态：仅图标变蓝并切换为填充样式，去掉竖线/方块/白底/阴影 */
    .rail-item[aria-current="page"] .rail-icon {
      color: var(--ink-accent);
    }

    .rail-item[aria-current="page"] .rail-icon .icon {
      fill: currentColor;
      stroke: currentColor;
    }

    .rail-item:disabled {
      color: var(--ink-muted);
      cursor: not-allowed;
    }

    .context-sidebar {
      grid-column: 2;
      grid-row: 1;
      z-index: 30;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: var(--panel-line);
      background: var(--ink-bg);
      overscroll-behavior: contain;
      transition: transform 180ms ease;
    }

    .sidebar-head {
      height: var(--docbar-size);
      flex: 0 0 var(--docbar-size);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 16px;
      border-bottom: var(--panel-line);
    }

    .sidebar-title {
      min-width: 0;
      flex: 1;
      font-size: 14px;
      font-weight: 800;
    }

    .square-btn {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 2px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-1);
      transition: transform var(--motion-fast), box-shadow var(--motion-fast), background var(--motion-fast);
    }

    .square-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-2);
    }

    .square-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .square-btn--primary {
      background: var(--ink-accent);
      color: #fff;
    }

    .square-btn .icon { width: 16px; height: 16px; }

    /* 侧栏头部按钮：去掉方块外框，改为纯图标样式 */
    .sidebar-head .square-btn {
      width: 30px;
      height: 30px;
      position: relative;
      border: 0;
      background: transparent;
      box-shadow: none;
      color: var(--ink-secondary);
    }
    .sidebar-head .square-btn:hover {
      transform: none;
      box-shadow: none;
      background: var(--ink-sunken);
      color: var(--ink);
    }
    .sidebar-head .square-btn:active { transform: none; }
    .sidebar-head .square-btn .icon { width: 18px; height: 18px; }

    /* 新建：无外框、淡雅的立体蓝色加号（细笔画 + 柔和投影营造悬浮立体感） */
    .sidebar-head .square-btn--primary { color: var(--ink-accent); }
    .sidebar-head .square-btn--primary:hover {
      background: transparent;
      color: var(--ink-accent-hover);
    }
    .sidebar-head .square-btn--primary::before,
    .sidebar-head .square-btn--primary::after {
      content: "";
      position: absolute;
      background: currentColor;
      /* 柔和投影：跟随加号轮廓偏移弥散，营造悬浮立体感 */
      filter: drop-shadow(1px 2px 1px rgba(26, 26, 26, .5));
    }
    .sidebar-head .square-btn--primary::before {
      width: 16px;
      height: 6px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .sidebar-head .square-btn--primary::after {
      width: 6px;
      height: 16px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .sidebar-search {
      padding: 10px 12px;
      border-bottom: var(--panel-line);
    }

    .search-box {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-1);
    }

    .search-box .icon {
      width: 16px;
      height: 16px;
      color: var(--ink-secondary);
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
    }

    .search-box:focus-within { box-shadow: 2px 2px 0 var(--ink-accent); }

    .sidebar-scroll {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 8px 0 12px;
    }

    .section-label {
      padding: 12px 18px 6px;
      color: var(--ink-secondary);
      font: 800 10px/1.4 var(--font-mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .tree-row {
      width: 100%;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 6px 16px;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .tree-row:hover { background: var(--ink-sunken); }

    /* 选中态：图标与文字变蓝，图标切换为填充样式；去掉白底与左侧竖线 */
    .tree-row[aria-current="page"],
    .tree-row.is-current {
      color: var(--ink-accent);
      font-weight: 700;
    }

    .tree-row[aria-current="page"] .icon,
    .tree-row.is-current .icon {
      fill: currentColor;
      stroke: currentColor;
    }

    .tree-row--nested { padding-left: 38px; }

    .tree-row--document {
      color: var(--ink-secondary);
      font-weight: 400;
    }

    .tree-row--document.is-current { color: var(--ink-accent); }

    .tree-row .icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }

    .tree-label {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-count {
      color: var(--ink-secondary);
      font: 10px/1 var(--font-mono);
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 9px;
      padding: 5px 18px 12px;
    }

    .tag {
      --tag-edge: #38bdf8;
      --tag-fill: #e0f2fe;
      --tag-text: #0369a1;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 2px 8px;
      border: 1px solid var(--tag-edge);
      background: var(--tag-fill);
      color: var(--tag-text);
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      /* 实心位移阴影：底部 + 右侧，对齐整体 UI 的硬阴影风格 */
      box-shadow: 2px 3px 0 var(--tag-edge);
      transform: translateY(-1px);
    }

    .tag--purple { --tag-edge: #a855f7; --tag-fill: #f3e8ff; --tag-text: #7e22ce; }
    .tag--green { --tag-edge: #22c55e; --tag-fill: #dcfce7; --tag-text: #15803d; }
    .tag--orange { --tag-edge: #fb923c; --tag-fill: #ffedd5; --tag-text: #c2410c; }

    .sidebar-foot {
      flex: 0 0 auto;
      padding: 7px 0;
      border-top: var(--panel-line);
    }

    /* ===== 主工作区：暖色点阵背景 ===== */
    .workspace {
      grid-column: 3;
      grid-row: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: auto;
      scroll-padding: 96px 0 64px;
      background-color: var(--ink-bg);
      background-image: radial-gradient(var(--ink-dot) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* ===== 笔记索引：结构化列表 + 访达式图标视图 ===== */
    .index-page {
      width: min(1440px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: clamp(28px, 4vw, 58px) clamp(22px, 4vw, 64px) 72px;
    }

    .index-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      color: var(--ink-secondary);
      font: 750 11px/1.2 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .index-breadcrumb .index-marker {
      width: 10px;
      height: 10px;
      background: var(--ink-accent);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .index-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 32px;
    }

    .index-title-wrap { min-width: 0; }

    .index-title {
      margin: 0;
      font-size: 40px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .index-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .index-btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      box-shadow: var(--shadow-1);
      transition: transform var(--motion-fast) ease, box-shadow var(--motion-fast) ease;
    }

    .index-btn:hover { transform: translate(-1px, -1px); box-shadow: var(--shadow-2); }
    .index-btn:active { transform: translate(1px, 1px); box-shadow: none; }
    .index-btn .icon { width: 16px; height: 16px; }

    .index-btn--primary {
      border-color: var(--ink-accent);
      background: var(--ink-accent);
      color: var(--ink-surface);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .mobile-sidebar-btn { display: none; }

    .index-toolbar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-2);
    }

    .index-search {
      min-width: 0;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid var(--ink-panel);
      background: var(--ink-sunken);
    }

    .index-search:focus-within { border-color: var(--ink-accent); box-shadow: inset 3px 0 0 var(--ink-accent); }
    .index-search .icon { width: 16px; height: 16px; color: var(--ink-secondary); }

    .index-search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
    }

    .index-filters,
    .index-toolbar-end,
    .view-switch {
      display: flex;
      align-items: center;
    }

    .index-filters { gap: 4px; }
    .index-toolbar-end { gap: 8px; }

    .filter-chip,
    .sort-btn,
    .view-btn {
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 11px;
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 11px;
      font-weight: 750;
    }

    .filter-chip:hover,
    .sort-btn:hover,
    .view-btn:hover { background: var(--ink-sunken); color: var(--ink); }

    .filter-chip[aria-pressed="true"] {
      background: var(--ink);
      color: var(--ink-surface);
    }

    .sort-control { position: relative; display: inline-flex; }
    .sort-btn { border: 1px solid var(--ink-panel); }
    .sort-btn .icon { width: 15px; height: 15px; }
    .sort-btn .sort-chevron {
      width: 12px;
      height: 12px;
      transform: rotate(90deg);
      color: var(--ink-muted);
      transition: transform var(--motion-fast);
    }
    .sort-control.is-open .sort-chevron { transform: rotate(270deg); }

    /* 排序下拉菜单：点击（焦点）时弹出，右侧对齐触发器 */
    .sort-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 50;
      min-width: 140px;
      padding: 5px;
      display: none;
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-1);
    }
    .sort-control.is-open .sort-menu { display: block; }
    .sort-menu button {
      width: 100%;
      min-height: 30px;
      display: flex;
      align-items: center;
      padding: 5px 10px;
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
    }
    .sort-menu button:hover { background: var(--ink-sunken); color: var(--ink); }
    .sort-menu button[aria-checked="true"] { color: var(--ink-accent); }

    .view-switch {
      height: 36px;
      border: 1px solid var(--ink);
      background: var(--ink-sunken);
    }

    .view-btn {
      width: 38px;
      padding: 0;
      border-right: 1px solid var(--ink);
    }

    .view-btn:last-child { border-right: 0; }
    .view-btn .icon { width: 16px; height: 16px; }
    .view-btn[aria-pressed="true"] { background: var(--ink-accent); color: var(--ink-surface); }

    .index-meta-row {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 17px 4px 9px;
      color: var(--ink-secondary);
      font-size: 11px;
    }

    .index-meta-row strong { color: var(--ink); }

    .index-view { margin-top: 10px; }

    .list-frame {
      overflow: hidden;
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-2);
    }

    .resource-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .resource-table th {
      height: 38px;
      padding: 0 14px;
      border-bottom: 1px solid var(--ink);
      background: var(--ink-sunken);
      color: var(--ink-secondary);
      font: 750 10px/1 var(--font-mono);
      letter-spacing: .08em;
      text-align: left;
      text-transform: uppercase;
    }

    .resource-table td {
      height: 58px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--ink-panel);
      color: var(--ink-secondary);
      font-size: 12px;
      vertical-align: middle;
    }

    .resource-table tr:last-child td { border-bottom: 0; }
    .resource-table tbody tr:hover td { background: var(--ink-sunken); }
    .resource-table .col-name { width: 40%; }
    .resource-table .col-status { width: 15%; }
    .resource-table .col-place { width: 19%; }
    .resource-table .col-date { width: 18%; }
    .resource-table .col-menu { width: 44px; padding-inline: 4px; }

    .resource-name {
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .resource-name:hover .resource-name-label { color: var(--ink-accent); text-decoration: underline; text-underline-offset: 3px; }

    .resource-name-label {
      min-width: 0;
      overflow: hidden;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-file {
      width: 28px;
      height: 32px;
      position: relative;
      flex: 0 0 auto;
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: 2px 2px 0 var(--ink-panel);
    }

    .mini-file::after {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      top: 10px;
      height: 1px;
      background: var(--ink-secondary);
      box-shadow: 0 5px 0 var(--ink-panel), 0 10px 0 var(--ink-panel);
    }

    .mini-file--folder {
      height: 23px;
      margin-top: 5px;
      border-color: var(--ink-accent);
      background: var(--ink-accent-soft);
      box-shadow: 2px 2px 0 var(--ink-accent);
    }

    .mini-file--folder::before {
      content: "";
      position: absolute;
      left: -1px;
      top: -6px;
      width: 14px;
      height: 6px;
      border: 1px solid var(--ink-accent);
      border-bottom: 0;
      background: var(--ink-accent-soft);
    }

    .mini-file--folder::after { display: none; }

    .status-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--ink);
      font-size: 11px;
      font-weight: 650;
    }

    .status-label::before { content: ""; width: 8px; height: 8px; background: var(--item-color, var(--ink-muted)); }
    .status-label--active { --item-color: var(--ink-accent); }
    .status-label--done { --item-color: var(--ink-success); }
    .status-label--draft { --item-color: var(--ink-warning); }
    .status-label--folder { --item-color: var(--ink); }

    .row-more {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
    }

    .row-more:hover { background: var(--ink-panel); color: var(--ink); }
    .row-more .icon { width: 16px; height: 16px; }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
      gap: clamp(18px, 3vw, 34px) clamp(14px, 2.6vw, 30px);
      padding: clamp(22px, 3.4vw, 38px);
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-2);
    }

    .resource-tile {
      min-width: 0;
      min-height: 154px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      padding: 14px 9px 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      text-align: center;
    }

    .resource-tile:hover { border-color: var(--ink-panel); background: var(--ink-sunken); }
    .resource-tile.is-selected { border-color: var(--ink-accent); background: var(--ink-accent-soft); box-shadow: 3px 3px 0 var(--ink-accent); }

    .tile-art {
      width: 84px;
      height: 88px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .folder-art {
      width: 82px;
      height: 58px;
      position: relative;
      margin-top: 14px;
      border: 2px solid var(--ink);
      background: var(--ink-accent-soft);
      box-shadow: 5px 5px 0 var(--ink-accent);
    }

    .folder-art::before {
      content: "";
      position: absolute;
      left: -2px;
      top: -13px;
      width: 38px;
      height: 13px;
      border: 2px solid var(--ink);
      border-bottom: 0;
      background: var(--ink-accent-soft);
    }

    .folder-art::after {
      content: attr(data-count);
      position: absolute;
      right: 6px;
      bottom: 5px;
      color: var(--ink-accent);
      font: 800 10px/1 var(--font-mono);
    }

    .document-art {
      width: 62px;
      height: 82px;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: 5px 5px 0 var(--doc-edge, var(--ink-panel));
    }

    .document-art::before {
      content: "";
      position: absolute;
      top: -2px;
      right: -2px;
      width: 17px;
      height: 17px;
      border-left: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      background: var(--ink-sunken);
    }

    .document-art::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 29px;
      height: 2px;
      background: var(--ink);
      box-shadow: 0 9px 0 var(--ink-panel), 0 18px 0 var(--ink-panel), 0 27px 0 var(--ink-panel);
    }

    .document-art--blue { --doc-edge: #38bdf8; }
    .document-art--purple { --doc-edge: #a855f7; }
    .document-art--green { --doc-edge: #22c55e; }
    .document-art--orange { --doc-edge: #fb923c; }

    .tile-copy { width: 100%; min-width: 0; }

    .tile-name {
      display: -webkit-box;
      overflow: hidden;
      color: var(--ink);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.4;
      text-overflow: ellipsis;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .tile-meta {
      display: block;
      margin-top: 4px;
      color: var(--ink-secondary);
      font: 10px/1.3 var(--font-mono);
    }

    .index-empty {
      min-height: 260px;
      display: grid;
      place-items: center;
      padding: 36px;
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-2);
      text-align: center;
    }

    .index-empty-mark {
      width: 34px;
      height: 34px;
      margin: 0 auto 14px;
      border: 2px solid var(--ink);
      background: var(--ink-sunken);
      box-shadow: 5px 5px 0 var(--ink-accent);
    }

    .index-empty h2 { margin: 0 0 5px; font-size: 16px; }
    .index-empty p { margin: 0; color: var(--ink-secondary); font-size: 12px; }

    .index-toast {
      position: fixed;
      right: 22px;
      bottom: 48px;
      z-index: 90;
      max-width: min(360px, calc(100vw - 44px));
      padding: 10px 14px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--ink-surface);
      font-size: 12px;
      font-weight: 700;
      box-shadow: 4px 4px 0 var(--ink-accent);
    }

    .statusbar {
      grid-column: 1 / -1;
      grid-row: 2;
      z-index: 60;
      min-width: 0;
      height: var(--status-size);
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
      padding: 0 12px 0 16px;
      border-top: var(--shell-line-soft);
      background: var(--ink-bg);
      /* 沿上缘线向内容区投一层柔和阴影，形成面板浮起感 */
      box-shadow: 0 -8px 16px rgba(26, 26, 26, .09);
      color: var(--ink-secondary);
      font-size: 11px;
      white-space: nowrap;
    }

    .status-context,
    .status-item {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .status-context {
      overflow: hidden;
      color: var(--ink);
      font-weight: 750;
    }

    .status-context span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-spacer { flex: 1; }
    .mono { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .status-square {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      background: var(--ink-accent);
    }

    .status-square--sync { background: var(--ink-success); }
    .status-square--warning { background: var(--ink-warning); }

    .status-switches {
      align-self: stretch;
      display: flex;
    }

    .status-switch {
      width: 34px;
      min-width: 34px;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
    }

    .status-switch .icon { width: 16px; height: 16px; }

    .status-switch:hover { color: var(--ink); }

    /* 选中态：图标变蓝 */
    .status-switch[aria-pressed="true"] {
      color: var(--ink-accent);
    }

    .mobile-tabs { display: none; }

    .live-region {
      position: fixed;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    body.is-sidebar-closed .app-shell { grid-template-columns: var(--rail-size) 0 minmax(0, 1fr); }
    body.is-sidebar-closed .context-sidebar { transform: translateX(-100%); visibility: hidden; }

    @media (max-width: 1100px) {
      :root {
        --sidebar-size: 208px;
      }
      .index-page { padding-inline: 32px; }
      .index-toolbar { grid-template-columns: minmax(180px, 1fr) auto; }
      .index-filters { grid-column: 1 / -1; grid-row: 2; }
      .resource-table .col-status { width: 18%; }
      .resource-table .col-place { display: none; }
    }

    @media (max-width: 860px) {
      .app-shell { grid-template-columns: var(--rail-size) minmax(0, 1fr); }
      .context-sidebar {
        position: fixed;
        left: var(--rail-size);
        top: 0;
        bottom: var(--status-size);
        width: min(300px, calc(100vw - var(--rail-size) - 24px));
        box-shadow: 8px 0 18px rgba(26, 26, 26, .12);
        overscroll-behavior: contain;
        transform: translateX(-110%);
        visibility: hidden;
      }
      .context-sidebar.is-open { transform: translateX(0); visibility: visible; }
      .workspace { grid-column: 2; }
      body.is-sidebar-closed .app-shell { grid-template-columns: var(--rail-size) minmax(0, 1fr); }
      body.is-sidebar-closed .context-sidebar { transform: translateX(-110%); }
      .mobile-sidebar-btn { display: inline-flex; }
      .index-head { align-items: flex-start; }
    }

    @media (max-width: 767px) {
      :root {
        --mobile-tabs-size: calc(56px + env(safe-area-inset-bottom));
      }
      .app-shell {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) var(--status-size) var(--mobile-tabs-size);
      }
      .module-rail { display: none; }
      .context-sidebar {
        left: 0;
        bottom: calc(var(--status-size) + var(--mobile-tabs-size));
        width: min(330px, calc(100vw - 28px));
      }
      .workspace { grid-column: 1; }
      .index-page { padding: 24px 16px 58px; }
      .index-head { display: block; margin-bottom: 24px; }
      .index-title { font-size: 40px; }
      .index-actions { margin-top: 20px; }
      .index-btn { min-height: 44px; }
      .index-toolbar { grid-template-columns: 1fr auto; gap: 9px; padding: 10px; }
      .index-search { height: 44px; }
      .index-toolbar-end { gap: 6px; }
      .sort-btn { width: 44px; height: 44px; padding: 0; }
      .sort-btn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .view-switch { height: 44px; }
      .view-btn { width: 44px; height: 42px; }
      .index-filters { overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
      .index-filters::-webkit-scrollbar { display: none; }
      .filter-chip { height: 40px; white-space: nowrap; }
      .resource-table .col-status,
      .resource-table .col-date { display: none; }
      .resource-table .col-name { width: auto; }
      .resource-table td { height: 64px; }
      .icon-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 10px; padding: 18px 10px; }
      .resource-tile { min-height: 152px; padding-inline: 5px; }
      .statusbar {
        grid-column: 1;
        grid-row: 2;
        gap: 10px;
        padding-inline: 10px;
      }
      .status-context { flex: 1; }
      .status-item--saved,
      .status-switches { display: none; }
      .mobile-tabs {
        grid-column: 1;
        grid-row: 3;
        z-index: 65;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        padding-bottom: env(safe-area-inset-bottom);
        border-top: var(--shell-line-soft);
        background: var(--ink-bg);
      }
      .mobile-tab {
        min-width: 0;
        display: grid;
        place-items: center;
        gap: 2px;
        padding: 5px 2px;
        border: 0;
        border-top: 3px solid transparent;
        background: transparent;
        color: var(--ink-secondary);
        font-size: 10px;
      }
      .mobile-tab[aria-current="page"] { border-top-color: var(--ink-accent); color: var(--ink-accent); font-weight: 800; }
      .mobile-tab .icon { width: 18px; height: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <a class="skip-link" href="#workspace">跳到主区域</a>

  <div class="app-shell">
    <aside class="module-rail" aria-label="全局模块轨道">
      <button class="brand" type="button" aria-label="返回知境主页" title="返回主页">
        <span class="brand-glyph" aria-hidden="true">知</span>
      </button>
      <div class="rail-group" aria-label="全局操作">

          <span class="rail-icon"><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg></span>
        </button>
        <button class="rail-item" type="button" aria-label="全局新建" title="全局新建">
          <span class="rail-icon"><svg class="icon" aria-hidden="true"><use href="#icon-add"/></svg></span>

        <button class="rail-item" type="button" aria-label="知识库，尚未上线" title="知识库 · 尚未上线" disabled>
          <span class="rail-icon"><svg class="icon" aria-hidden="true"><use href="#icon-book"/></svg></span>

  <script>
    const body = document.body;
    const contextSidebar = document.querySelector('#context-sidebar');
    const liveRegion = document.querySelector('#live-region');
    const resourceSearch = document.querySelector('#resource-search');
    const listView = document.querySelector('#list-view');
    const gridView = document.querySelector('#grid-view');
    const emptyState = document.querySelector('#index-empty');
    const visibleCount = document.querySelector('#visible-count');
    const statusCount = document.querySelector('#status-count');
    const viewDescription = document.querySelector('#view-description');
    const toast = document.querySelector('#index-toast');
    let activeView = 'list';
    let activeFilter = 'all';
    let activeSort = 'updated';
    const SORT_LABELS = { name: '名称', updated: '最近更新', created: '创建日期' };
    let toastTimer;

    function announce(message) {
      liveRegion.textContent = '';
      requestAnimationFrame(() => { liveRegion.textContent = message; });
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.hidden = false;
      toastTimer = window.setTimeout(() => { toast.hidden = true; }, 2200);
      announce(message);
    }

    function setSidebar(open) {
      const statusButton = document.querySelector('[data-action="sidebar"]');
      const mobileButton = document.querySelector('[data-action="mobile-sidebar"]');
      statusButton?.setAttribute('aria-pressed', String(open));
      mobileButton?.setAttribute('aria-expanded', String(open));

      if (window.matchMedia('(max-width: 860px)').matches) {
        contextSidebar.classList.toggle('is-open', open);
      } else {
        body.classList.toggle('is-sidebar-closed', !open);
      }
      announce(`侧栏已${open ? '打开' : '关闭'}`);
    }

    function activeItems() {
      const container = activeView === 'list' ? listView : gridView;
      return [...container.querySelectorAll('[data-resource]')];
    }

    function applyIndexState({ shouldAnnounce = false } = {}) {
      const query = resourceSearch.value.trim().toLocaleLowerCase('zh-CN');
      document.querySelectorAll('[data-resource]').forEach((item) => {
        const matchesType = activeFilter === 'all' || item.dataset.type === activeFilter;
        const searchable = (item.dataset.searchable || '').toLocaleLowerCase('zh-CN');
        item.hidden = !(matchesType && searchable.includes(query));
      });

      const count = activeItems().filter((item) => !item.hidden).length;
      visibleCount.textContent = String(count);
      statusCount.textContent = String(count);
      listView.hidden = activeView !== 'list' || count === 0;
      gridView.hidden = activeView !== 'grid' || count === 0;
      emptyState.hidden = count !== 0;
      const sortLabel = SORT_LABELS[activeSort];
      viewDescription.textContent = `${activeView === 'list' ? '列表视图' : '图标视图'} · 按${sortLabel}排序`;
      if (shouldAnnounce) announce(`当前显示 ${count} 项笔记`);
    }

    function setView(view) {
      activeView = view;
      document.querySelectorAll('[data-view]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.view === view));
      });
      applyIndexState();
      announce(`已切换到${view === 'list' ? '列表' : '文件夹图标'}视图`);
    }

    function sortContainer(container) {
      const items = [...container.querySelectorAll('[data-resource]')];
      items.sort((a, b) => {
        if (activeSort === 'name') return a.dataset.name.localeCompare(b.dataset.name, 'zh-CN');
        return Number(b.dataset.updated) - Number(a.dataset.updated) || a.dataset.name.localeCompare(b.dataset.name, 'zh-CN');
      });
      items.forEach((item) => container.appendChild(item));
    }

    function applySort() {
      sortContainer(document.querySelector('#resource-table-body'));
      sortContainer(document.querySelector('#resource-grid'));
      const sortButton = document.querySelector('[data-action="sort"]');
      const label = SORT_LABELS[activeSort];
      sortButton.dataset.sort = activeSort;
      sortButton.setAttribute('aria-label', `当前按${label}排序`);
      sortButton.querySelector('span').textContent = label;
      document.querySelectorAll('[data-sort-option]').forEach((item) => {
        item.setAttribute('aria-checked', String(item.dataset.sortOption === activeSort));
      });
      applyIndexState();
      announce(`已按${label}排序`);
    }

    document.addEventListener('click', (event) => {
      const action = event.target.closest('[data-action]');

      if (action?.dataset.action === 'sidebar') {
        setSidebar(action.getAttribute('aria-pressed') !== 'true');
      }

      if (action?.dataset.action === 'mobile-sidebar') {
        setSidebar(action.getAttribute('aria-expanded') !== 'true');
      }

      if (action?.dataset.action === 'new-note') {
        showToast('新建笔记 · Demo 操作已触发');
      }

      if (action?.dataset.action === 'import') {
        showToast('导入笔记 · Demo 操作已触发');
      }

      if (action?.dataset.action === 'open-index') {
        showToast('已打开全部笔记索引');
      }

      if (action?.dataset.action === 'sort') {
        const control = action.closest('.sort-control');
        const open = control.classList.toggle('is-open');
        action.setAttribute('aria-expanded', String(open));
      }

      const sortOption = event.target.closest('[data-sort-option]');
      if (sortOption) {
        const control = sortOption.closest('.sort-control');
        control.classList.remove('is-open');
        control.querySelector('[data-action="sort"]').setAttribute('aria-expanded', 'false');
        activeSort = sortOption.dataset.sortOption;
        applySort();
      }

      const viewButton = event.target.closest('[data-view]');
      if (viewButton) setView(viewButton.dataset.view);

      const filterButton = event.target.closest('[data-filter]');
      if (filterButton) {
        activeFilter = filterButton.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach((button) => {
          button.setAttribute('aria-pressed', String(button === filterButton));
        });
        applyIndexState({ shouldAnnounce: true });
      }

      const openButton = event.target.closest('[data-open]');
      if (openButton) {
        document.querySelectorAll('.resource-tile').forEach((tile) => tile.classList.toggle('is-selected', tile === openButton));
        showToast(`打开「${openButton.dataset.open}」· Demo 操作已触发`);
      }

      const moreButton = event.target.closest('[data-more]');
      if (moreButton) showToast(`「${moreButton.dataset.more}」更多操作 · Demo`);

      if (window.matchMedia('(max-width: 860px)').matches && contextSidebar.classList.contains('is-open')) {
        const clickedOutside = !event.target.closest('#context-sidebar') && !event.target.closest('[data-action="mobile-sidebar"]');
        if (clickedOutside) setSidebar(false);
      }

      if (!event.target.closest('.sort-control')) {
        document.querySelectorAll('.sort-control.is-open').forEach((control) => {
          control.classList.remove('is-open');
          control.querySelector('[data-action="sort"]').setAttribute('aria-expanded', 'false');
        });
      }
    });

    document.querySelectorAll('.status-switch:not([data-action="sidebar"])').forEach((button) => {
      button.addEventListener('click', () => {
        const next = button.getAttribute('aria-pressed') !== 'true';
        button.setAttribute('aria-pressed', String(next));
        announce(`${button.title}已${next ? '开启' : '关闭'}`);
      });
    });

    resourceSearch.addEventListener('input', () => applyIndexState({ shouldAnnounce: true }));

    document.addEventListener('keydown', (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLocaleLowerCase() === 'b') {
        event.preventDefault();
        setView(activeView === 'list' ? 'grid' : 'list');
      }
      if (event.key === 'Escape') {
        if (contextSidebar.classList.contains('is-open')) setSidebar(false);
        const openControls = document.querySelectorAll('.sort-control.is-open');
        if (openControls.length) {
          openControls.forEach((control) => {
            control.classList.remove('is-open');
            control.querySelector('[data-action="sort"]').setAttribute('aria-expanded', 'false');
          });
        }
      }
    });

    applySort();
  </script>
</body>
</html>
