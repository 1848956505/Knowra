<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F9F7F2">
  <title>知境 · 印格资料索引页 Demo</title>
  <style>
    :root {
      --ink-bg: #f9f7f2;
      --ink-surface: #ffffff;
      --ink-sunken: #f4f1ea;
      --ink: #1a1a1a;
      --ink-secondary: #66635e;
      --ink-muted: #aaa8a2;
      --ink-panel: #e5e2dc;
      --ink-soft: #f0eee9;
      --ink-dot: #d1d1d1;
      --ink-accent: #2563eb;
      --ink-accent-hover: #1d4ed8;
      --ink-accent-soft: #e0f2fe;
      --ink-success: #16a34a;
      --ink-warning: #ea580c;
      --ink-danger: #dc2626;
      /* 外壳线：2px 墨黑保留给浮层/按钮等特色元素的描边 */
      --shell-line: 2px solid var(--ink);
      /* 外壳分区线：减薄为 1px、颜色柔化为暖墨灰，用于模块轨道/状态栏等窗口主分区 */
      --ink-shell: #a8a29a;
      --shell-line-soft: 1px solid var(--ink-shell);
      --panel-line: 1px solid var(--ink-panel);
      --soft-line: 1px solid var(--ink-soft);
      /* 硬阴影：保留实心位移骨架，仅加 1px 模糊并柔化为暖灰，降低锐利感 */
      --shadow-1: 2px 2px 1px #6b6b6b;
      --shadow-2: 3px 3px 1px #6b6b6b;
      --shadow-focus: 3px 3px 0 var(--ink-accent);
      --rail-size: 64px;
      --sidebar-size: 224px;
      --status-size: 32px;
      --docbar-size: 52px;
      --motion-fast: 140ms;
      --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html,
    body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--ink-bg);
      color: var(--ink);
      font: 14px/1.5 var(--font-ui);
    }

    button,
    input { font: inherit; }

    button {
      color: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:not(:disabled) { cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    [contenteditable="true"]:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--ink-surface);
      outline-offset: 1px;
      box-shadow: var(--shadow-focus);
    }

    [hidden] { display: none !important; }

    .icon {
      width: 19px;
      height: 19px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: square;
      stroke-linejoin: miter;
      stroke-width: 1.8;
    }

    .skip-link {
      position: fixed;
      left: 12px;
      top: 10px;
      z-index: 1000;
      padding: 8px 12px;
      border: var(--shell-line);
      background: var(--ink-surface);
      color: var(--ink);
      font-weight: 800;
      box-shadow: var(--shadow-1);
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: translateY(0); }

    .app-shell {
      width: 100vw;
      height: 100dvh;
      display: grid;
      grid-template-columns: var(--rail-size) var(--sidebar-size) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) var(--status-size);
      background: var(--ink-surface);
    }

    .module-rail {
      grid-column: 1;
      grid-row: 1;
      z-index: 40;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px 0 12px;
      border-right: var(--shell-line-soft);
      background: var(--ink-bg);
      /* 沿右缘线向内容区投一层柔和阴影，形成面板浮起感 */
      box-shadow: 8px 0 16px rgba(26, 26, 26, .09);
      scrollbar-width: none;
    }

    .module-rail::-webkit-scrollbar { display: none; }

    .brand {
      width: 40px;
      height: 40px;
      position: relative;
      flex: 0 0 40px;
      margin: 0 auto 7px;
      border: 0;
      background: transparent;
    }

    .brand::before,
    .brand::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
    }

    .brand::before {
      right: 3px;
      bottom: 3px;
      background: var(--ink-accent);
    }

    .brand::after {
      left: 3px;
      top: 3px;
      border: var(--shell-line);
      background: var(--ink-surface);
    }

    .brand-glyph {
      position: absolute;
      inset: 4px auto auto 4px;
      z-index: 1;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
    }

    .rail-group { display: grid; gap: 1px; }
    .rail-group--utility { margin-top: auto; }

    .rail-item {
      width: 100%;
      min-height: 46px;
      display: grid;
      place-items: center;
      padding: 3px 0;
      border: 0;
      background: transparent;
    }

    .rail-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      transition: color var(--motion-fast), transform var(--motion-fast);
    }

    .rail-item:hover .rail-icon { color: var(--ink); }

    .rail-item:active .rail-icon { transform: translate(2px, 2px); }

    /* 选中态：仅图标变蓝并切换为填充样式，去掉竖线/方块/白底/阴影 */
    .rail-item[aria-current="page"] .rail-icon {
      color: var(--ink-accent);
    }

    .rail-item[aria-current="page"] .rail-icon .icon {
      fill: currentColor;
      stroke: currentColor;
    }

    .rail-item:disabled {
      color: var(--ink-muted);
      cursor: not-allowed;
    }

    .context-sidebar {
      grid-column: 2;
      grid-row: 1;
      z-index: 30;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: var(--panel-line);
      background: var(--ink-bg);
      overscroll-behavior: contain;
      transition: transform 180ms ease;
    }

    .sidebar-head {
      height: var(--docbar-size);
      flex: 0 0 var(--docbar-size);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 16px;
      border-bottom: var(--panel-line);
    }

    .sidebar-title {
      min-width: 0;
      flex: 1;
      font-size: 14px;
      font-weight: 800;
    }

    .square-btn {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 2px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-1);
      transition: transform var(--motion-fast), box-shadow var(--motion-fast), background var(--motion-fast);
    }

    .square-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-2);
    }

    .square-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .square-btn--primary {
      background: var(--ink-accent);
      color: #fff;
    }

    .square-btn .icon { width: 16px; height: 16px; }

    /* 侧栏头部按钮：去掉方块外框，改为纯图标样式 */
    .sidebar-head .square-btn {
      width: 30px;
      height: 30px;
      position: relative;
      border: 0;
      background: transparent;
      box-shadow: none;
      color: var(--ink-secondary);
    }
    .sidebar-head .square-btn:hover {
      transform: none;
      box-shadow: none;
      background: var(--ink-sunken);
      color: var(--ink);
    }
    .sidebar-head .square-btn:active { transform: none; }
    .sidebar-head .square-btn .icon { width: 18px; height: 18px; }

    /* 新建：无外框、淡雅的立体蓝色加号（细笔画 + 柔和投影营造悬浮立体感） */
    .sidebar-head .square-btn--primary,
    .index-tools .square-btn--primary { color: var(--ink-accent); }
    .sidebar-head .square-btn--primary:hover,
    .index-tools .square-btn--primary:hover {
      background: transparent;
      color: var(--ink-accent-hover);
    }
    .sidebar-head .square-btn--primary::before,
    .sidebar-head .square-btn--primary::after,
    .index-tools .square-btn--primary::before,
    .index-tools .square-btn--primary::after {
      content: "";
      position: absolute;
      background: currentColor;
      /* 柔和投影：跟随加号轮廓偏移弥散，营造悬浮立体感 */
      filter: drop-shadow(1px 2px 1px rgba(26, 26, 26, .5));
    }
    .sidebar-head .square-btn--primary::before,
    .index-tools .square-btn--primary::before {
      width: 16px;
      height: 6px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .sidebar-head .square-btn--primary::after,
    .index-tools .square-btn--primary::after {
      width: 6px;
      height: 16px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .sidebar-search {
      padding: 10px 12px;
      border-bottom: var(--panel-line);
    }

    .search-box {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-1);
    }

    .search-box .icon {
      width: 16px;
      height: 16px;
      color: var(--ink-secondary);
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
    }

    .search-box:focus-within { box-shadow: 2px 2px 0 var(--ink-accent); }

    .sidebar-scroll {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 8px 0 12px;
    }

    .section-label {
      padding: 12px 18px 6px;
      color: var(--ink-secondary);
      font: 800 10px/1.4 var(--font-mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .tree-row {
      width: 100%;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 6px 16px;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .tree-row:hover { background: var(--ink-sunken); }

    /* 选中态：图标与文字变蓝，图标切换为填充样式；去掉白底与左侧竖线 */
    .tree-row[aria-current="page"],
    .tree-row.is-current {
      color: var(--ink-accent);
      font-weight: 700;
    }

    .tree-row[aria-current="page"] .icon,
    .tree-row.is-current .icon {
      fill: currentColor;
      stroke: currentColor;
    }

    .tree-row--nested { padding-left: 38px; }

    .tree-row--document {
      color: var(--ink-secondary);
      font-weight: 400;
    }

    .tree-row--document.is-current { color: var(--ink-accent); }

    .tree-row .icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }

    .tree-label {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-count {
      color: var(--ink-secondary);
      font: 10px/1 var(--font-mono);
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 9px;
      padding: 5px 18px 12px;
    }

    .tag {
      --tag-edge: #38bdf8;
      --tag-fill: #e0f2fe;
      --tag-text: #0369a1;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 2px 8px;
      border: 1px solid var(--tag-edge);
      background: var(--tag-fill);
      color: var(--tag-text);
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      /* 实心位移阴影：底部 + 右侧，对齐整体 UI 的硬阴影风格 */
      box-shadow: 2px 3px 0 var(--tag-edge);
      transform: translateY(-1px);
    }

    .tag--purple { --tag-edge: #a855f7; --tag-fill: #f3e8ff; --tag-text: #7e22ce; }
    .tag--green { --tag-edge: #22c55e; --tag-fill: #dcfce7; --tag-text: #15803d; }
    .tag--orange { --tag-edge: #fb923c; --tag-fill: #ffedd5; --tag-text: #c2410c; }

    .sidebar-foot {
      flex: 0 0 auto;
      padding: 7px 0;
      border-top: var(--panel-line);
    }

    /* ===== 主工作区：资料索引 ===== */
    .workspace {
      grid-column: 3;
      grid-row: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: auto;
      scroll-padding: 96px 0 64px;
      background-color: var(--ink-bg);
      background-image: radial-gradient(var(--ink-dot) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .index-wrap {
      width: min(960px, calc(100% - 72px));
      min-height: calc(100% - 80px);
      margin: 40px auto 80px;
      position: relative;
    }

    .index-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--ink-accent);
      font: 800 10px/1.4 var(--font-mono);
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .index-kicker::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--ink-accent);
    }

    .index-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .index-title {
      margin: 0;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 850;
      line-height: 1.18;
      letter-spacing: -.04em;
    }

    .index-sub {
      margin: 8px 0 0;
      color: var(--ink-secondary);
      font: 11px/1.5 var(--font-mono);
    }

    .index-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 主区新建按钮：去掉方块外框，纯立体加号悬浮 */
    .index-tools .square-btn {
      width: 30px;
      height: 30px;
      position: relative;
      border: 0;
      background: transparent;
      box-shadow: none;
      color: var(--ink-secondary);
    }
    .index-tools .square-btn:hover {
      transform: none;
      box-shadow: none;
      background: transparent;
      color: var(--ink);
    }
    .index-tools .square-btn:active { transform: none; }

    .index-search {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-1);
    }

    .index-search .icon { width: 16px; height: 16px; color: var(--ink-secondary); }

    .index-search input {
      width: 170px;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
    }

    .index-search:focus-within { box-shadow: 2px 2px 0 var(--ink-accent); }

    .index-view-tabs {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--ink-shell);
      margin-bottom: 18px;
    }

    .index-view-tab {
      min-width: 0;
      padding: 9px 14px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    .index-view-tab:hover { color: var(--ink); }

    /* 经典 Tab：选中时文字变黑 + 底部黑色下划线 */
    .index-view-tab[aria-selected="true"] {
      border-bottom-color: var(--ink);
      color: var(--ink);
    }

    .index-view-tab .count {
      margin-left: 6px;
      color: var(--ink-muted);
      font: 800 10px/1 var(--font-mono);
    }

    .index-list {
      border: 1px solid var(--ink-shell);
      background: var(--ink-surface);
      box-shadow: var(--shadow-1);
    }

    .index-row {
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border: 0;
      border-bottom: 1px solid var(--soft-line);
      background: transparent;
      text-align: left;
    }

    .index-row:last-child { border-bottom: 0; }

    .index-row:hover { background: var(--ink-sunken); }

    .doc-cover-mini {
      width: 40px;
      height: 44px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      background: var(--ink-accent);
      color: #fff;
      font: 800 11px/1 var(--font-mono);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .doc-cover-mini--ink { background: var(--ink); }
    .doc-cover-mini--paper { background: var(--ink-surface); color: var(--ink); }

    .index-main {
      min-width: 0;
      flex: 1;
    }

    .index-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 3px;
    }

    .index-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 750;
    }

    .meta-state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--ink-warning);
      font: 800 10px/1 var(--font-mono);
      letter-spacing: .04em;
    }

    .meta-state::before {
      content: "";
      width: 6px;
      height: 6px;
      background: currentColor;
    }

    .meta-state--ok { color: var(--ink-success); }
    .meta-state--draft { color: var(--ink-muted); }

    .index-excerpt {
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink-secondary);
      font-size: 12px;
    }

    .index-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-muted);
      font: 10px/1.4 var(--font-mono);
    }

    .index-meta .tag {
      min-height: 0;
      padding: 1px 6px;
      font-size: 10px;
    }

    .index-right {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      color: var(--ink-secondary);
      font: 10px/1.4 var(--font-mono);
    }

    .index-pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      color: var(--ink-secondary);
      font: 10px/1 var(--font-mono);
    }

    .index-pager .pages { display: flex; gap: 6px; }

    .page-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--ink);
      background: var(--ink-surface);
      box-shadow: var(--shadow-1);
      font: 800 11px/1 var(--font-mono);
    }

    .page-btn:hover { transform: translate(-1px, -1px); box-shadow: var(--shadow-2); }

    .page-btn:active { transform: translate(2px, 2px); box-shadow: none; }

    .page-btn[aria-current="page"] {
      background: var(--ink-accent);
      color: #fff;
      border-color: var(--ink-accent);
    }

    .statusbar {
      grid-column: 1 / -1;
      grid-row: 2;
      z-index: 60;
      min-width: 0;
      height: var(--status-size);
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
      padding: 0 12px 0 16px;
      border-top: var(--shell-line-soft);
      background: var(--ink-bg);
      /* 沿上缘线向内容区投一层柔和阴影，形成面板浮起感 */
      box-shadow: 0 -8px 16px rgba(26, 26, 26, .09);
      color: var(--ink-secondary);
      font-size: 11px;
      white-space: nowrap;
    }

    .status-context,
    .status-item {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .status-context {
      overflow: hidden;
      color: var(--ink);
      font-weight: 750;
    }

    .status-context span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-spacer { flex: 1; }
    .mono { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .status-square {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      background: var(--ink-accent);
    }

    .status-square--sync { background: var(--ink-success); }
    .status-square--warning { background: var(--ink-warning); }

    .status-switches {
      align-self: stretch;
      display: flex;
    }

    .status-switch {
      width: 34px;
      min-width: 34px;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
    }

    .status-switch .icon { width: 16px; height: 16px; }

    .status-switch:hover { color: var(--ink); }

    /* 选中态：图标变蓝 */
    .status-switch[aria-pressed="true"] {
      color: var(--ink-accent);
    }

    .mobile-tabs { display: none; }

    .live-region {
      position: fixed;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    const body = document.body;
    const contextSidebar = document.querySelector('#context-sidebar');
    const liveRegion = document.querySelector('#live-region');

    function announce(message) {
      liveRegion.textContent = '';
      requestAnimationFrame(() => { liveRegion.textContent = message; });
    }

    document.addEventListener('click', (event) => {
      const action = event.target.closest('[data-action]');

      if (action?.dataset.action === 'sidebar') {
        const next = action.getAttribute('aria-pressed') !== 'true';
        action.setAttribute('aria-pressed', String(next));
        body.classList.toggle('is-sidebar-closed', !next);
        announce(`侧栏已${next ? '打开' : '关闭'}`);
      }

      if (action?.dataset.action === 'new-note') {
        announce('新建资料 · Demo 操作已触发');
      }

      if (action?.dataset.action === 'open-index') {
        announce('已打开全部笔记索引');
      }
    });

    document.querySelectorAll('.index-view-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.index-view-tab').forEach((item) => {
          const active = item === tab;
          item.setAttribute('aria-selected', String(active));
          item.tabIndex = active ? 0 : -1;
        });
        announce(`视图已切换：${tab.textContent.trim()}`);
      });
    });

    document.querySelectorAll('.index-row').forEach((row) => {
      row.addEventListener('click', () => {
        announce(`打开资料：${row.dataset.note}`);
      });
    });

    document.querySelectorAll('.page-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.page-btn').forEach((item) => item.removeAttribute('aria-current'));
        btn.setAttribute('aria-current', 'page');
        announce(`已跳转到第 ${btn.textContent.trim()} 页`);
      });
    });

    document.querySelectorAll('.status-switch').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('aria-pressed') !== 'true';
        btn.setAttribute('aria-pressed', String(next));
        announce(`${btn.title}已${next ? '开启' : '关闭'}`);
      });
    });
  </script>
</body>
</html>
