name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 · build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        # Prisma/Nest/BullMQ are future scaffolding and are not imported by the
        # current JSON-backed runtime. Avoid running their install hooks; the
        # only active generated asset is built explicitly in the next step.
        run: npm ci --ignore-scripts

      - name: Check changed-file whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

      - name: Build production V4 frontend
        run: NODE_ENV=production npm run build:web

      - name: Verify production source maps are absent
        shell: bash
        run: |
          test -f apps/web-v4/dist/index.html
          test -z "$(find apps/web-v4/dist -type f -name '*.map' -print -quit)"

      - name: Run test suites
        run: npm test

      - name: Audit production dependencies
        # Prisma is future scaffolding and reaches its CLI through an optional
        # peer dependency. Audit the dependencies shipped by the active runtime.
        run: npm run audit:prod
