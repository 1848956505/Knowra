name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 · build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: knowra_test
          POSTGRES_DB: knowra_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KNOWRA_SYNC_TEST_DATABASE_URL: postgresql://postgres:knowra_test@127.0.0.1:5432/knowra_sync_test
      KNOWRA_SYNC_TEST_ALLOW_WRITES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        # 关闭安装脚本；Prisma 客户端在下一步显式生成。
        run: npm ci --ignore-scripts

      - name: Prepare PostgreSQL sync tests
        env:
          DATABASE_URL: postgresql://postgres:knowra_test@127.0.0.1:5432/knowra_sync_test
        run: |
          npm run prisma:generate
          npm run prisma:migrate:deploy

      - name: Check changed-file whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

      - name: Build production V4 frontend
        run: NODE_ENV=production npm run build:web

      - name: Check V4 architecture boundaries
        run: npm run check:boundaries -w @study-accelerator/web-v4

      - name: Verify production source maps are absent
        shell: bash
        run: |
          test -f apps/web-v4/dist/index.html
          test -z "$(find apps/web-v4/dist -type f -name '*.map' -print -quit)"

      - name: Run test suites
        run: npm test

      - name: Verify local runtime in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -w @study-accelerator/desktop-runtime

      - name: Audit production dependencies
        # Prisma is future scaffolding and reaches its CLI through an optional
        # peer dependency. Audit the dependencies shipped by the active runtime.
        run: npm run audit:prod
