name: CI

on:
  workflow_dispatch:
  pull_request:
    # 只改实验脚本、实验工作流和讨论记录时不跑全量 CI；实验工作流会先跑自己的无费用测试。
    # 实验自己的测试由实验工作流运行；只要同时改了其他文件，CI 照常运行。
    paths-ignore:
      - "scripts/experiments/**"
      - "scripts/test/concept-linking-r2.test.js"
      - ".github/workflows/knowledge-*.yml"
      - "docs/知识库与试题模块/讨论记录/**"
  push:
    branches:
      - main
    paths-ignore:
      - "scripts/experiments/**"
      - "scripts/test/concept-linking-r2.test.js"
      - ".github/workflows/knowledge-*.yml"
      - "docs/知识库与试题模块/讨论记录/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.11 · 单元测试
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装测试依赖
        run: python -m pip install -r requirements.txt
      - name: 运行 Python 单元测试
        run: python -m pytest -v test_calculator.py

  isolated-image:
    name: Isolated test image and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build and verify isolated synthetic containers
        run: bash scripts/smoke-isolated-compose.sh
  checks:
    name: Node 24 · fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BEFORE_SHA...$GITHUB_SHA"
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi
      - name: Check V4 architecture boundaries
        run: npm run check:boundaries -w @study-accelerator/web-v4
      - name: Check migrated API TypeScript
        run: npm run typecheck:migrated -w @study-accelerator/api
      - name: Check CI coverage and failure gates
        run: node --test scripts/test/ci-workflow.test.js
      - name: Audit production dependencies
        run: npm run audit:prod

  suites:
    name: Node 24 · ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # 任一套件失败仍收集其他套件结果；不并发同一套件里的数据库测试。
      fail-fast: false
      matrix:
        suite: [api, web, desktop, chromium]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: knowra_test
          POSTGRES_DB: knowra_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KNOWRA_SYNC_TEST_DATABASE_URL: postgresql://postgres:knowra_test@127.0.0.1:5432/knowra_sync_test
      KNOWRA_SYNC_TEST_ALLOW_WRITES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        # 关闭安装脚本；Prisma 客户端在下一步显式生成。
        run: npm ci --ignore-scripts

      - name: Prepare PostgreSQL sync tests
        env:
          DATABASE_URL: postgresql://postgres:knowra_test@127.0.0.1:5432/knowra_sync_test
        run: |
          npm run prisma:generate
          npm run prisma:migrate:deploy

      - name: Build production V4 frontend
        run: NODE_ENV=production npm run build:web

      - name: Check V4 architecture boundaries
        run: npm run check:boundaries -w @study-accelerator/web-v4

      - name: Verify frontend release identity
        run: node scripts/release-artifact.mjs --verify-web "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Verify production source maps are absent
        shell: bash
        run: |
          test -f apps/web-v4/dist/index.html
          test -z "$(find apps/web-v4/dist -type f -name '*.map' -print -quit)"

      - name: Install Chromium and system dependencies
        if: matrix.suite == 'chromium'
        # 恢复回归复用合成页面配置，以 runner 预装的 Chrome 保留浏览器沙箱。
        run: |
          npx playwright install --with-deps chromium
          google-chrome --version

      - name: Run isolated test suite
        env:
          CI_SUITE: ${{ matrix.suite }}
        run: node scripts/ci.mjs suite "$CI_SUITE"

      - name: Save synthetic task workspace screenshots
        if: always() && matrix.suite == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: task-workspace-journey-${{ github.sha }}
          path: test-results/task-workspace-journey/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save synthetic editor recovery evidence
        if: always() && matrix.suite == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: editor-draft-recovery-${{ github.sha }}
          path: |
            apps/web-v4/test-results/mobile-evidence
            apps/web-v4/playwright-report/mobile-evidence
          if-no-files-found: warn
          retention-days: 7

  verify:
    # 保留原 required check 名称；失败、取消或跳过任一前置作业都不能变绿。
    name: Node 24 · build and test
    if: always()
    needs: [checks, suites, isolated-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Require every test job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci.mjs gate
      # 分支只跑 PR；无 PR 时可手动全量验证并生成候选包。
      - name: Install release dependencies
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm ci --ignore-scripts
      - name: Build verified release snapshot
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: NODE_ENV=production npm run build:web
      - name: Package Linux release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: bash scripts/package-ci-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/knowra-release"
      - name: Save release for Codex deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: knowra-linux-release-${{ github.sha }}
          path: ${{ runner.temp }}/knowra-release/knowra-release-${{ github.sha }}.tar.gz*
          if-no-files-found: error
          retention-days: 14
