name: Mobile synthetic evidence
on:
  pull_request:
    paths:
      - 'apps/web-v4/**'
      - 'packages/web-core/**'
      - '.github/workflows/mobile-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # 使用 runner 预装且受系统 AppArmor profile 支持的 Chrome，保留浏览器沙箱。
      - run: google-chrome --version
      # 保留中文验收所需的系统字体；不改浏览器/内核安全配置。
      - run: npx playwright install-deps chromium
      - name: Verify Chinese font availability
        run: |
          fc-list :lang=zh family | sort -u | tee chinese-fonts.txt
          test -s chinese-fonts.txt
          echo "KNOWRA_EVIDENCE_CJK_FONT=$(fc-match -f '%{family}' 'sans-serif:lang=zh-cn')" >> "$GITHUB_ENV"
      - run: npm run build:web
      - name: Capture synthetic viewports
        env:
          KNOWRA_MOBILE_EVIDENCE: '1'
          KNOWRA_EVIDENCE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          KNOWRA_EVIDENCE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          KNOWRA_EVIDENCE_BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          cp chinese-fonts.txt apps/web-v4/dist/chinese-fonts.txt
          export KNOWRA_EVIDENCE_SHA="$(git rev-parse HEAD)"
          export KNOWRA_EVIDENCE_SOURCE_TREE="$(git rev-parse HEAD:apps/web-v4/src)"
          export KNOWRA_BASE_PRODUCTION_EQUIVALENT=false
          if git diff --quiet "$KNOWRA_EVIDENCE_BASE" HEAD -- . \
            ':(exclude).github/workflows/mobile-evidence.yml' \
            ':(exclude)apps/web-v4/playwright.mobile-evidence.config.ts' \
            ':(exclude)apps/web-v4/e2e/mobile-evidence.spec.ts' \
            ':(exclude)apps/web-v4/e2e/mobile-evidence.fixture.ts'; then
            export KNOWRA_BASE_PRODUCTION_EQUIVALENT=true
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
          fi
          npm run test:e2e -w @study-accelerator/web-v4 -- --config playwright.mobile-evidence.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-evidence-${{ github.sha }}
          path: |
            apps/web-v4/test-results/mobile-evidence
            apps/web-v4/playwright-report/mobile-evidence
            apps/web-v4/dist/build-info.json
            apps/web-v4/dist/chinese-fonts.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact screenshots and measurements
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots-${{ github.sha }}
          path: |
            apps/web-v4/test-results/mobile-evidence/*/*.png
            apps/web-v4/test-results/mobile-evidence/*/scenario-manifest.json
            apps/web-v4/dist/build-info.json
            apps/web-v4/dist/chinese-fonts.txt
          if-no-files-found: error
          retention-days: 14
